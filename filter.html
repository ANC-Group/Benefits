<style>
  .filter-panel {
    width: 100%;
    margin-top: 26px;
  }

  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .filter-field:first-child {
    grid-column: 1 / -1;
  }

  .filter-field label {
    display: block;
    margin-bottom: 7px;
    color: #706564;
    font-size: 12px;
    font-weight: 700;
  }

  .filter-field input,
  .filter-field select {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    border: 1px solid #e3d9d8;
    border-radius: 12px;
    background: #fdfafa;
    color: #332c2b;
    font-size: 14px;
    outline: none;
    transition:
      border-color .15s ease,
      box-shadow .15s ease,
      background .15s ease;
  }

  .filter-field select {
    cursor: pointer;
  }

  .filter-field input::placeholder {
    color: #aaa09f;
  }

  .filter-field input:hover,
  .filter-field select:hover {
    border-color: #d7c2c0;
  }

  .filter-field input:focus,
  .filter-field select:focus {
    border-color: #5aa66d;
    background: white;
    box-shadow: 0 0 0 3px rgba(90, 166, 109, .10);
  }

  .company-preview {
    margin-top: 16px;
    height: 88px;
    border: 1px solid #ece7e7;
    border-radius: 14px;
    background: #fffdfd;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  .company-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }

  .company-preview-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 16px;
    font-weight: 800;
    color: #6e6161;
  }

  .continue-button {
    width: 100%;
    min-height: 52px;
    margin-top: 18px;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: #58a96d;
    color: white;
    font-size: 15px;
    font-weight: 750;
    line-height: 1.3;
    cursor: pointer;
    transition:
      transform .15s ease,
      background .15s ease,
      box-shadow .15s ease;
  }

  .continue-button:hover:not(:disabled) {
    background: #438b57;
    transform: translateY(-1px);
    box-shadow: 0 9px 20px rgba(67, 139, 87, .20);
  }

  .continue-button:disabled {
    opacity: .40;
    cursor: not-allowed;
  }

  .filter-error {
    display: none;
    margin-top: 12px;
    color: #b84f50;
    font-size: 12px;
    text-align: center;
  }

  @media(max-width:650px) {
    .filters {
      grid-template-columns: 1fr;
    }

    .filter-field:first-child {
      grid-column: auto;
    }

    .continue-button {
      font-size: 14px;
    }
  }
</style>

<div class="filter-panel">

  <div class="filters">

    <!-- AD -->
    <div class="filter-field">
      <label for="firstNameInput">
        👤 Ad
      </label>

      <input
        id="firstNameInput"
        type="text"
        placeholder="Adınızı yazın"
        autocomplete="given-name"
      >
    </div>

    <!-- ŞİRKƏT -->
    <div class="filter-field">
      <label for="companyFilter">
        🏢 Şirkət
      </label>

      <select id="companyFilter">
        <option value="">
          Şirkətinizi seçin
        </option>

        <option value="anc-group">
          ANC Group
        </option>

        <option value="rahat-market">
          Rahat Market
        </option>

        <option value="rahat-gourmet">
          Rahat Gourmet
        </option>

        <option value="port-baku-bazar">
          Port Baku Bazar
        </option>

        <option value="pribaltika">
          Pribaltika
        </option>
      </select>
    </div>

    <!-- İŞÇİ KATEQORİYASI -->
    <div class="filter-field">
      <label for="workerCategoryFilter">
        👥 İşçi kateqoriyası
      </label>

      <select id="workerCategoryFilter">
        <option value="">
          İşçi kateqoriyasını seçin
        </option>

        <option value="office">
          Ofis əməkdaşı
        </option>

        <option value="store">
          Mağaza əməkdaşı
        </option>
      </select>
    </div>

  </div>

  <div class="company-preview">
    <img id="companyLogoPreview" alt="Şirkət logosu">
    <div
      class="company-preview-fallback"
      id="companyLogoFallback"
    ></div>
  </div>

  <button
    class="continue-button"
    id="continueButton"
    disabled
  >
    İmtiyazlar ilə tanış ol və yararlan →
  </button>

  <div
    class="filter-error"
    id="filterError"
  >
    Zəhmət olmasa adınızı, şirkəti və işçi kateqoriyasını seçin.
  </div>

</div>
