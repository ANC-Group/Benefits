<style>

  .filter-panel {

    width: 100%;

    margin-top: 26px;

  }


  .filters {

    display: grid;

    grid-template-columns:
      1fr 1fr;

    gap: 14px;

  }


  .filter-field:first-child {

    grid-column:
      1 / -1;

  }


  .filter-field label {

    display: block;

    margin-bottom: 7px;

    color: #605756;

    font-size: 12px;

    font-weight: 750;

  }


  .filter-field input,
  .filter-field select {

    width: 100%;

    height: 52px;

    padding:
      0 14px;

    border:
      1px solid #e3d9d8;

    border-radius: 13px;

    background: #fdfafa;

    color: #332c2b;

    font-size: 14px;

    outline: none;

    transition:
      border-color .15s ease,
      box-shadow .15s ease,
      background .15s ease;

  }


  .filter-field select {

    cursor: pointer;

  }


  .filter-field input::placeholder {

    color: #aaa09f;

  }


  .filter-field input:hover,
  .filter-field select:hover {

    border-color: #d7c2c0;

  }


  .filter-field input:focus,
  .filter-field select:focus {

    border-color: #4db66b;

    background: white;

    box-shadow:
      0 0 0 3px
      rgba(77,182,107,.10);

  }


  /* =========================
     GREEN BUTTON
  ========================= */

  .continue-button {

    width: 100%;

    min-height: 52px;

    margin-top: 20px;

    padding:
      13px 18px;

    border: none;

    border-radius: 13px;

    background: #4db66b;

    color: white;

    font-size: 15px;

    font-weight: 800;

    line-height: 1.3;

    cursor: pointer;

    transition:
      transform .15s ease,
      background .15s ease,
      box-shadow .15s ease;

  }


  .continue-button:hover:not(:disabled) {

    background: #399a56;

    transform:
      translateY(-1px);

    box-shadow:
      0 9px 20px
      rgba(57,154,86,.20);

  }


  .continue-button:disabled {

    opacity: .40;

    cursor: not-allowed;

  }


  /* =========================
     ANC LOGO UNDER BUTTON
  ========================= */

  .anc-main-logo {

    width: 100%;

    min-height: 100px;

    margin-top: 18px;

    padding: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
      1px solid #eee4e3;

    border-radius: 18px;

    background: #fffdfd;

  }


  .anc-main-logo img {

    width: auto;

    max-width: 270px;

    max-height: 78px;

    object-fit: contain;

    display: block;

  }


  .filter-error {

    display: none;

    margin-top: 12px;

    color: #b84f50;

    font-size: 12px;

    text-align: center;

  }


  @media(max-width:650px) {

    .filters {

      grid-template-columns:
        1fr;

    }


    .filter-field:first-child {

      grid-column: auto;

    }


    .continue-button {

      font-size: 14px;

    }


    .anc-main-logo {

      min-height: 90px;

    }


    .anc-main-logo img {

      max-width: 230px;

      max-height: 70px;

    }

  }

</style>



<div class="filter-panel">


  <div class="filters">


    <!-- =========================
         AD
    ========================= -->

    <div class="filter-field">


      <label for="firstNameInput">

        👤 Ad

      </label>


      <input
        id="firstNameInput"
        type="text"
        placeholder="Adınızı yazın"
        autocomplete="given-name"
      >


    </div>



    <!-- =========================
         ŞİRKƏT
    ========================= -->

    <div class="filter-field">


      <label for="companyFilter">

        🏢 Şirkət

      </label>


      <select id="companyFilter">


        <option value="">

          Şirkətinizi seçin

        </option>


        <option value="anc-group">

          ANC Group

        </option>


        <option value="rahat-market">

          Rahat Market

        </option>


        <option value="rahat-gourmet">

          Rahat Gourmet

        </option>


        <option value="port-baku-bazar">

          Port Baku Bazar

        </option>


        <option value="pribaltika">

          Pribaltika

        </option>


      </select>


    </div>



    <!-- =========================
         İŞÇİ KATEQORİYASI
    ========================= -->

    <div class="filter-field">


      <label for="workerCategoryFilter">

        👥 İşçi kateqoriyası

      </label>


      <select id="workerCategoryFilter">


        <option value="">

          İşçi kateqoriyasını seçin

        </option>


        <option value="office">

          Ofis əməkdaşı

        </option>


        <option value="store">

          Mağaza əməkdaşı

        </option>


      </select>


    </div>


  </div>



  <!-- =========================
       BUTTON
  ========================= -->

  <button
    class="continue-button"
    id="continueButton"
    disabled
  >

    İmtiyazlar ilə tanış ol və yararlan →

  </button>



  <!-- =========================
       ANC LOGO
       BUTTON-DAN SONRA
  ========================= -->

  <div class="anc-main-logo">


    <img
      src="anc-logo.png"
      alt="ANC Group"
    >


  </div>



  <div
    class="filter-error"
    id="filterError"
  >

    Zəhmət olmasa adınızı, şirkəti və işçi kateqoriyasını seçin.

  </div>


</div>
