<!DOCTYPE html>
<html lang="az">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Group İmtiyazlar Platforması</title>


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #f7f8f7;
      --card: #ffffff;

      --green: #4db66b;
      --green-dark: #337f4b;
      --green-soft: #eaf7ee;

      --red: #d96662;
      --red-dark: #b94e4b;
      --red-soft: #fdeeed;

      --orange-soft: #fff1e8;

      --text: #262626;
      --muted: #848484;

      --border: #ececec;

      --shadow:
        0 10px 28px rgba(0,0,0,.055);

    }


    body {

      margin: 0;

      padding-bottom: 92px;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    }


    button,
    input {
      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    .app {

      width: 100%;

      max-width: 540px;

      min-height: 100vh;

      margin: auto;

      background:
        var(--bg);

    }


    /* =========================================
       HEADER
    ========================================= */

    .top {

      padding:
        18px 18px 10px;

      background:

        radial-gradient(
          circle at 90% 0%,
          rgba(217,102,98,.10),
          transparent 36%
        ),

        linear-gradient(
          180deg,
          #fff4f2 0%,
          #f7f8f7 100%
        );

    }


    .top-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 11px;

      min-width: 0;

    }


    .avatar {

      width: 49px;

      height: 49px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #dd7772,
          #bf4d49
        );

      color: white;

      box-shadow:
        var(--shadow);

    }


    .avatar svg {

      width: 30px;

      height: 30px;

    }


    .hello {

      min-width: 0;

    }


    .hello-title {

      margin: 0;

      font-size: 21px;

      font-weight: 850;

      line-height: 1.1;

    }


    .hello-subtitle {

      margin-top: 4px;

      color:
        var(--muted);

      font-size: 11px;

    }


    .top-actions {

      display: flex;

      align-items: center;

      gap: 6px;

      flex-shrink: 0;

    }


    .change-button {

      min-height: 40px;

      padding:
        0 9px;

      border:
        1px solid #d7eadf;

      border-radius: 13px;

      background:
        var(--green-soft);

      color:
        var(--green-dark);

      font-size: 9px;

      font-weight: 800;

      white-space: nowrap;

    }


    .notification-button {

      position: relative;

      width: 42px;

      height: 42px;

      border: none;

      border-radius: 14px;

      background: white;

      box-shadow:
        var(--shadow);

      font-size: 19px;

    }


    .notification-badge {

      position: absolute;

      top: -5px;

      right: -5px;

      min-width: 21px;

      height: 21px;

      padding:
        0 5px;

      display: none;

      align-items: center;

      justify-content: center;

      border:
        3px solid #fff4f2;

      border-radius: 999px;

      background:
        var(--red);

      color: white;

      font-size: 9px;

      font-weight: 850;

    }


    /* =========================================
       SEARCH
    ========================================= */

    .search-box {

      height: 52px;

      margin-top: 18px;

      padding:
        0 16px;

      display: flex;

      align-items: center;

      gap: 10px;

      border:
        1px solid var(--border);

      border-radius: 17px;

      background: white;

      box-shadow:
        var(--shadow);

    }


    .search-box input {

      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      font-size: 14px;

    }


    .search-icon {

      opacity: .6;

    }


    /* =========================================
       MAIN
    ========================================= */

    main {

      padding:
        5px 18px 30px;

    }


    .screen.hidden {

      display: none;

    }


    .section {

      margin-top: 23px;

    }


    .section-header {

      margin-bottom: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .section-title {

      margin: 0;

      font-size: 21px;

      font-weight: 850;

    }


    .section-link {

      border: none;

      background: transparent;

      color:
        var(--muted);

      font-size: 12px;

    }


    /* =========================================
       CATEGORIES
    ========================================= */

    .categories {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 9px;

    }


    .category-card {

      min-height: 102px;

      padding:
        11px 5px 9px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: white;

      box-shadow:
        var(--shadow);

    }


    .category-icon {

      width: 44px;

      height: 44px;

      margin-bottom: 8px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      background:
        var(--orange-soft);

      font-size: 20px;

    }


    .category-name {

      color: #464646;

      font-size: 10px;

      font-weight: 750;

      line-height: 1.2;

      text-align: center;

    }


    /* =========================================
       FEATURED / NEW PARTNERS
    ========================================= */

    .horizontal-cards {

      display: flex;

      gap: 13px;

      overflow-x: auto;

      padding-bottom: 6px;

    }


    .horizontal-cards::-webkit-scrollbar {

      display: none;

    }


    .featured-card {

      min-width: 245px;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 22px;

      background: white;

      box-shadow:
        var(--shadow);

    }


    .featured-top {

      position: relative;

      height: 135px;

      padding: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:

        radial-gradient(
          circle at 90% 10%,
          rgba(217,102,98,.13),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #eff9f2,
          #ffffff
        );

      color:
        var(--green-dark);

      font-size: 27px;

      font-weight: 900;

      text-align: center;

    }


    .discount-badge {

      position: absolute;

      top: 13px;

      right: 13px;

      padding:
        6px 9px;

      border-radius: 11px;

      background:
        var(--red);

      color: white;

      font-size: 11px;

      font-weight: 850;

    }


    .favorite-button {

      width: 36px;

      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid #f0dddd;

      border-radius: 50%;

      background: white;

      color:
        var(--red);

      font-size: 20px;

    }


    .favorite-button.active {

      background:
        var(--red-soft);

    }


    .featured-top .favorite-button {

      position: absolute;

      top: 12px;

      left: 12px;

    }


    .featured-body {

      padding: 15px;

    }


    .featured-name {

      font-size: 17px;

      font-weight: 850;

    }


    .featured-description {

      margin-top: 6px;

      min-height: 35px;

      color: #727272;

      font-size: 12px;

      line-height: 1.45;

    }


    .featured-bottom {

      margin-top: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

    }


    .category-chip {

      padding:
        6px 9px;

      border-radius: 999px;

      background:
        var(--green-soft);

      color:
        var(--green-dark);

      font-size: 10px;

      font-weight: 800;

    }


    .open-button {

      width: 35px;

      height: 35px;

      border: none;

      border-radius: 50%;

      background: #f3f4f3;

      color: #555;

      font-size: 17px;

    }


    /* =========================================
       STANDARD PARTNER LIST
    ========================================= */

    .partner-list {

      display: grid;

      gap: 12px;

    }


    .partner-card {

      padding: 16px;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: white;

      box-shadow:
        var(--shadow);

    }


    .partner-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;

    }


    .partner-info {

      flex: 1;

      min-width: 0;

    }


    .partner-name {

      font-size: 17px;

      font-weight: 850;

    }


    .partner-description {

      margin-top: 5px;

      color:
        #757575;

      font-size: 12px;

      line-height: 1.5;

      white-space: pre-line;

    }


    .right-actions {

      display: flex;

      align-items: center;

      gap: 7px;

    }


    .small-discount {

      padding:
        6px 8px;

      border-radius: 999px;

      background:
        var(--red-soft);

      color:
        var(--red-dark);

      font-size: 11px;

      font-weight: 850;

      white-space: nowrap;

    }


    .tags {

      margin-top: 12px;

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

    }


    .tag {

      padding:
        6px 9px;

      border-radius: 999px;

      background: #f3f7f5;

      color: #5c6861;

      font-size: 10px;

      font-weight: 750;

    }


    .card-buttons {

      margin-top: 13px;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    .soft-button {

      padding:
        10px 13px;

      border: none;

      border-radius: 12px;

      background:
        var(--green-soft);

      color:
        var(--green-dark);

      font-size: 11px;

      font-weight: 800;

      text-decoration: none;

    }


    .soft-button.red {

      background:
        var(--red-soft);

      color:
        var(--red-dark);

    }


    /* =========================================
       EMPTY
    ========================================= */

    .empty-box {

      padding: 27px 20px;

      border:
        1px dashed #d7dfda;

      border-radius: 18px;

      background: white;

      color: #777;

      font-size: 13px;

      line-height: 1.55;

      text-align: center;

    }


    .empty-icon {

      margin-bottom: 8px;

      font-size: 34px;

    }


    /* =========================================
       NOTIFICATION PANEL
    ========================================= */

    .notification-panel {

      position: fixed;

      top: 78px;

      left: 16px;

      right: 16px;

      z-index: 400;

      max-width: 500px;

      margin: auto;

      padding: 16px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: white;

      box-shadow:
        0 20px 55px rgba(0,0,0,.13);

    }


    .notification-panel.hidden {

      display: none;

    }


    .notification-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

    }


    .close-button {

      width: 32px;

      height: 32px;

      border: none;

      border-radius: 50%;

      background: #f4f4f4;

      font-size: 16px;

    }


    .notification-item {

      padding:
        11px 0;

      border-bottom:
        1px solid #f0f0f0;

    }


    .notification-item:last-child {

      border-bottom: none;

    }


    .notification-title {

      font-size: 13px;

      font-weight: 850;

    }


    .notification-text {

      margin-top: 4px;

      color: #6f6f6f;

      font-size: 12px;

      line-height: 1.4;

    }


    /* =========================================
       MODAL
    ========================================= */

    .modal-backdrop {

      position: fixed;

      inset: 0;

      z-index: 600;

      padding:
        20px 14px;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      background:
        rgba(24,24,24,.43);

    }


    .modal-backdrop.hidden {

      display: none;

    }


    .modal {

      width: 100%;

      max-width: 520px;

      max-height: 87vh;

      overflow-y: auto;

      padding: 20px;

      border-radius:
        25px 25px 18px 18px;

      background: white;

      box-shadow:
        0 25px 70px rgba(0,0,0,.20);

    }


    .modal-header {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;

    }


    .modal-title {

      margin: 0;

      font-size: 23px;

      font-weight: 900;

    }


    .modal-category {

      margin-top: 5px;

      color:
        var(--green-dark);

      font-size: 11px;

      font-weight: 800;

    }


    .modal-section {

      margin-top: 20px;

    }


    .modal-label {

      margin-bottom: 7px;

      color: #919191;

      font-size: 10px;

      font-weight: 850;

      text-transform: uppercase;

      letter-spacing: .6px;

    }


    .modal-content {

      color: #484848;

      font-size: 13px;

      line-height: 1.65;

      white-space: pre-line;

    }


    .discount-box {

      margin-top: 16px;

      padding:
        14px 15px;

      border-radius: 15px;

      background:
        var(--red-soft);

      color:
        var(--red-dark);

    }


    .discount-box strong {

      font-size: 22px;

    }


    /* PROMO */

    .promo-box {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding:
        12px 14px;

      border:
        1px dashed #cde2d4;

      border-radius: 14px;

      background:
        var(--green-soft);

    }


    .promo-code {

      color:
        var(--green-dark);

      font-size: 18px;

      font-weight: 900;

      letter-spacing: .5px;

    }


    .copy-button {

      padding:
        8px 10px;

      border: none;

      border-radius: 10px;

      background: white;

      color:
        var(--green-dark);

      font-size: 10px;

      font-weight: 850;

    }


    /* RELATED PERSON */

    .contact-box {

      padding: 15px;

      border:
        1px solid #d8e9df;

      border-radius: 15px;

      background:
        #f5fbf7;

    }


    .contact-name {

      color: #353535;

      font-size: 14px;

      font-weight: 850;

    }


    .contact-phone {

      margin-top: 7px;

    }


    .phone-link {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      color:
        var(--green-dark);

      font-size: 14px;

      font-weight: 850;

      text-decoration: none;

    }


    .contact-help {

      margin-top: 8px;

      color: #888;

      font-size: 10px;

      line-height: 1.4;

    }


    .external-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    /* =========================================
       BOTTOM NAV
    ========================================= */

    .bottom-nav {

      position: fixed;

      left: 50%;

      bottom: 0;

      z-index: 300;

      transform:
        translateX(-50%);

      width: 100%;

      max-width: 540px;

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      padding:
        8px 5px
        calc(8px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(12px);

    }


    .nav-button {

      padding:
        7px 2px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 4px;

      border: none;

      border-radius: 13px;

      background: transparent;

      color: #7e7e7e;

      font-size: 9px;

      font-weight: 750;

    }


    .nav-button.active {

      background:
        var(--green-soft);

      color:
        var(--green-dark);

    }


    .nav-icon {

      font-size: 18px;

    }


    @media(max-width:420px) {

      .top,
      main {

        padding-left: 14px;

        padding-right: 14px;

      }


      .hello-title {

        font-size: 18px;

      }


      .avatar {

        width: 44px;

        height: 44px;

      }


      .change-button {

        padding:
          0 6px;

        font-size: 8px;

      }


      .categories {

        gap: 7px;

      }


      .category-card {

        min-height: 94px;

        padding:
          10px 3px 7px;

      }


      .category-icon {

        width: 40px;

        height: 40px;

        font-size: 18px;

      }


      .category-name {

        font-size: 9px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <header class="top">


    <div class="top-row">


      <div class="user-area">


        <div class="avatar">

          <svg
            viewBox="0 0 64 64"
            fill="none"
          >

            <circle
              cx="32"
              cy="18"
              r="10"
              fill="currentColor"
            />

            <path
              d="M14 52C16.5 42 23.5 36 32 36C40.5 36 47.5 42 50 52"
              fill="currentColor"
            />

          </svg>

        </div>


        <div class="hello">

          <h1
            class="hello-title"
            id="helloTitle"
          >
            Salam
          </h1>


          <div class="hello-subtitle">

            Özəl imtiyazları kəşf edin!

          </div>

        </div>


      </div>



      <div class="top-actions">


        <button
          class="change-button"
          id="changeButton"
        >

          Şirkət / kateqoriya

        </button>


        <button
          class="notification-button"
          id="notificationButton"
        >

          🔔

          <span
            class="notification-badge"
            id="notificationBadge"
          >
          </span>

        </button>


      </div>


    </div>



    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Partnyor və ya kateqoriya axtar"
      >

    </div>


  </header>



  <main>


    <!-- =====================================
         HOME
    ====================================== -->

    <section
      class="screen"
      id="screen-home"
    >


      <div class="section">


        <div class="section-header">


          <h2 class="section-title">
            Kateqoriyalar
          </h2>


          <button
            class="section-link"
            id="allCategoriesButton"
          >
            Hamısı ›
          </button>


        </div>


        <div
          class="categories"
          id="categoriesContainer"
        >
        </div>


      </div>



      <div class="section">


        <div class="section-header">


          <h2 class="section-title">
            Yeni partnyorlar
          </h2>


          <button
            class="section-link"
            id="allPartnersButton"
          >
            Hamısı ›
          </button>


        </div>


        <div
          class="horizontal-cards"
          id="newPartnersContainer"
        >
        </div>


      </div>


    </section>



    <!-- =====================================
         NEARBY
    ====================================== -->

    <section
      class="screen hidden"
      id="screen-nearby"
    >


      <div class="section">


        <div class="section-header">

          <h2 class="section-title">
            Yaxınlıqda
          </h2>

        </div>


        <div
          class="empty-box"
          id="locationMessage"
        >

          Yaxınlıqdakı partnyorları göstərmək üçün
          konum icazəsi tələb olunur.

        </div>


        <div
          class="partner-list"
          id="nearbyContainer"
          style="margin-top:12px;"
        >
        </div>


      </div>


    </section>



    <!-- =====================================
         FAVORITES
    ====================================== -->

    <section
      class="screen hidden"
      id="screen-favorites"
    >


      <div class="section">


        <div class="section-header">


          <h2 class="section-title">
            Favorilər
          </h2>


          <span
            class="section-link"
            id="favoriteCount"
          >
            0 partnyor
          </span>


        </div>


        <div
          class="partner-list"
          id="favoritesContainer"
        >
        </div>


      </div>


    </section>



    <!-- =====================================
         PARTNERS
    ====================================== -->

    <section
      class="screen hidden"
      id="screen-partners"
    >


      <div class="section">


        <div class="section-header">


          <h2
            class="section-title"
            id="partnersTitle"
          >
            Partnyorlar
          </h2>


        </div>


        <div
          class="partner-list"
          id="partnersContainer"
        >
        </div>


      </div>


    </section>


  </main>


</div>



<!-- =====================================
     NOTIFICATIONS
====================================== -->

<div
  class="notification-panel hidden"
  id="notificationPanel"
>


  <div class="notification-header">

    <strong>
      Bildirişlər
    </strong>


    <button
      class="close-button"
      id="closeNotificationButton"
    >
      ✕
    </button>

  </div>


  <div id="notificationContainer">
  </div>


</div>



<!-- =====================================
     PARTNER MODAL
====================================== -->

<div
  class="modal-backdrop hidden"
  id="modalBackdrop"
>


  <div class="modal">


    <div class="modal-header">


      <div>

        <h2
          class="modal-title"
          id="modalTitle"
        >
        </h2>


        <div
          class="modal-category"
          id="modalCategory"
        >
        </div>

      </div>


      <button
        class="close-button"
        id="closeModalButton"
      >
        ✕
      </button>


    </div>


    <div id="modalBody">
    </div>


  </div>


</div>



<!-- =====================================
     BOTTOM NAVIGATION
====================================== -->

<nav class="bottom-nav">


  <button
    class="nav-button active"
    data-screen="home"
  >

    <span class="nav-icon">

/*
  DƏQİQ MƏSAFƏ ÜÇÜN:
  Excel-də gələcəkdə hər partnyor üçün
  latitude və longitude əlavə etmək kifayətdir.
*/

function requestLocation() {


  if (
    !navigator.geolocation
  ) {


    locationMessage.innerHTML =

      "Bu cihaz konum funksiyasını dəstəkləmir.";


    renderNearbyLinks();


    return;

  }



  locationMessage.innerHTML =

    "📍 Konum icazəsi gözlənilir...";



  navigator.geolocation.getCurrentPosition(


    function() {


      const hasCoordinates =

        partners.some(

          partner =>

            typeof partner.lat === "number"

            &&

            typeof partner.lng === "number"

        );



      if (
        hasCoordinates
      ) {


        locationMessage.innerHTML =

          "✅ Konum icazəsi verildi.";


      }

      else {


        locationMessage.innerHTML =

          `✅ Konum icazəsi verildi.

          Partnyorların koordinatları əlavə olunduqca
          məsafə burada avtomatik hesablanacaq.`;

      }


      renderNearbyLinks();


    },


    function(error) {


      if (
        error.code === 1
      ) {


        locationMessage.innerHTML =

          "📍 Konum icazəsi verilmədi. Brauzer və ya telefon ayarlarından konum icazəsini aktiv edə bilərsiniz.";


      }

      else {


        locationMessage.innerHTML =

          "Konum məlumatını əldə etmək mümkün olmadı.";


      }


      renderNearbyLinks();


    },


    {

      enableHighAccuracy:
        true,

      timeout:
        10000,

      maximumAge:
        300000

    }


  );

}



/* =========================================
   NAVIGATION
========================================= */

const screens = {

  home:
    document.getElementById(
      "screen-home"
    ),

  nearby:
    document.getElementById(
      "screen-nearby"
    ),

  favorites:
    document.getElementById(
      "screen-favorites"
    ),

  partners:
    document.getElementById(
      "screen-partners"
    )

};



function openScreen(
  screenName
) {


  Object
    .values(
      screens
    )
    .forEach(
      screen =>

        screen
          .classList
          .add(
            "hidden"
          )

    );


  screens[
    screenName
  ]
  .classList
  .remove(
    "hidden"
  );



  document
    .querySelectorAll(
      ".nav-button"
    )
    .forEach(
      function(button) {


        button.classList.toggle(

          "active",

          button.dataset.screen ===
          screenName

        );


      }
    );



  if (
    screenName ===
    "favorites"
  ) {


    renderFavorites();


  }



  if (
    screenName ===
    "partners"
  ) {


    document
      .getElementById(
        "partnersTitle"
      )
      .textContent =
        "Partnyorlar";


    renderPartners(
      partners
    );


  }



  if (
    screenName ===
    "nearby"
  ) {


    requestLocation();


  }



  window.scrollTo({

    top: 0,

    behavior:
      "smooth"

  });

}



function openPartnersByCategory(
  categoryName
) {


  openScreen(
    "partners"
  );


  document
    .getElementById(
      "partnersTitle"
    )
    .textContent =
      categoryName;



  const filtered =

    partners.filter(

      partner =>

        partner.category ===
        categoryName

    );


  renderPartners(
    filtered
  );

}

      if (
        !value
      ) {


        openScreen(
          "home"
        );


        return;

      }



      const results =

        partners.filter(
          function(partner) {


            const searchable = `

              ${partner.name || ""}

              ${partner.category || ""}

              ${partner.discount || ""}

              ${partner.details || ""}

              ${partner.usage || ""}

            `
            .toLowerCase();


            return searchable.includes(
              value
            );


          }
        );



      openScreen(
        "partners"
      );


      document
        .getElementById(
          "partnersTitle"
        )
        .textContent =
          "Axtarış nəticələri";


      renderPartners(
        results
      );


    }
  );
