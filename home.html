<!DOCTYPE html>
<html lang="az">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Group Benefits Hub</title>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #f7f8f7;
      --card: #ffffff;

      --soft-green: #e8f5ef;
      --green: #4ea97a;
      --green-dark: #2e7d5b;

      --soft-red: #fdeeed;
      --red: #d86b63;

      --soft-orange: #fff1e8;
      --orange: #ef8f57;

      --text: #232323;
      --muted: #8d8d8d;

      --border: #ececec;

      --shadow:
        0 10px 30px rgba(0,0,0,.05);

    }

    body {

      margin: 0;

      background: var(--bg);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      padding-bottom: 95px;

    }

    button,
    input {
      font-family: inherit;
    }

    .app {

      max-width: 520px;

      margin: 0 auto;

      min-height: 100vh;

      background: var(--bg);

    }


    /* ===============================
       TOP
    =============================== */

    .top-wrap {

      padding: 18px 18px 8px;

      background:
        linear-gradient(
          180deg,
          #fff1e8 0%,
          #f7f8f7 100%
        );

    }

    .top-bar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

    }

    .user-block {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }

    .avatar {

      width: 54px;

      height: 54px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ff9b61,
          #e96b42
        );

      color: white;

      box-shadow: var(--shadow);

    }

    .avatar svg {

      width: 34px;

      height: 34px;

    }

    .greeting-wrap {
      min-width: 0;
    }

    .greeting-title {

      margin: 0;

      font-size: 25px;

      font-weight: 800;

      line-height: 1.05;

      color: #2b2b2b;

    }

    .greeting-subtitle {

      margin-top: 5px;

      font-size: 13px;

      color: #747474;

    }


    /* ===============================
       TOP ACTIONS
    =============================== */

    .top-actions {

      display: flex;

      align-items: center;

      gap: 7px;

      flex-shrink: 0;

    }

    .change-filter-button {

      height: 44px;

      padding: 0 11px;

      border:
        1px solid #d8e9df;

      border-radius: 14px;

      background: #eef8f3;

      color: var(--green-dark);

      font-size: 11px;

      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;

    }

    .notif-button {

      position: relative;

      width: 46px;

      height: 46px;

      flex-shrink: 0;

      border: none;

      border-radius: 15px;

      background: white;

      box-shadow: var(--shadow);

      cursor: pointer;

    }

    .notif-button svg {

      width: 22px;

      height: 22px;

      stroke: var(--green-dark);

    }

    .notif-badge {

      position: absolute;

      top: -4px;

      right: -4px;

      min-width: 22px;

      height: 22px;

      padding: 0 6px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      border: 3px solid var(--bg);

      background: var(--red);

      color: white;

      font-size: 11px;

      font-weight: 800;

    }


    /* ===============================
       SEARCH
    =============================== */

    .search-box {

      margin-top: 18px;

      padding: 14px 16px;

      display: flex;

      align-items: center;

      gap: 10px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background: white;

      box-shadow: var(--shadow);

    }

    .search-box input {

      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 15px;

    }

    .search-box input::placeholder {

      color: #9a9a9a;

    }


    /* ===============================
       MAIN
    =============================== */

    .main-content {

      padding: 10px 18px 30px;

    }

    .section {

      margin-top: 22px;

    }

    .section-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 14px;

    }

    .section-title {

      margin: 0;

      font-size: 23px;

      font-weight: 800;

    }

    .section-link {

      color: #8d8d8d;

      font-size: 13px;

      cursor: pointer;

    }


    /* ===============================
       CATEGORIES
    =============================== */

    .categories-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

    }

    .category-card {

      padding: 14px 8px 12px;

      text-align: center;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: white;

      box-shadow: var(--shadow);

      cursor: pointer;

    }

    .category-icon {

      width: 52px;

      height: 52px;

      margin:
        0 auto 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 16px;

      background: var(--soft-orange);

      font-size: 24px;

    }

    .category-name {

      color: #444;

      font-size: 12px;

      font-weight: 700;

      line-height: 1.25;

    }


    /* ===============================
       PARTNER CARDS
    =============================== */

    .cards-row {

      display: flex;

      gap: 14px;

      overflow-x: auto;

      padding-bottom: 6px;

    }

    .cards-row::-webkit-scrollbar {
      display: none;
    }

    .partner-card {

      min-width: 250px;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 24px;

      background: white;

      box-shadow: var(--shadow);

      cursor: pointer;

    }

    .partner-banner {

      position: relative;

      height: 150px;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          var(--soft-green),
          #f6fbf8
        );

      color: var(--green-dark);

      font-size: 30px;

      font-weight: 900;

    }

    .discount-badge {

      position: absolute;

      top: 14px;

      right: 14px;

      padding: 6px 8px;

      border-radius: 12px;

      background: var(--red);

      color: white;

      font-size: 12px;

      font-weight: 800;

    }


    /* ===============================
       FAVORITE BUTTON
    =============================== */

    .favorite-button {

      width: 38px;

      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid #f0dddd;

      border-radius: 50%;

      background: white;

      color: var(--red);

      font-size: 21px;

      cursor: pointer;

      flex-shrink: 0;

      transition:
        transform .15s ease,
        background .15s ease;

    }

    .favorite-button:hover {

      transform: scale(1.06);

    }

    .favorite-button.active {

      background: var(--soft-red);

      color: var(--red);

    }

    .partner-banner .favorite-button {

      position: absolute;

      top: 14px;

      left: 14px;

      z-index: 5;

    }


    /* ===============================
       PARTNER BODY
    =============================== */

    .partner-body {

      padding: 16px;

    }

    .partner-title {

      margin:
        0 0 8px;

      font-size: 19px;

      font-weight: 800;

    }

    .partner-text {

      min-height: 42px;

      color: #666;

      font-size: 13px;

      line-height: 1.5;

    }

    .partner-meta {

      margin-top: 14px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

    }

    .partner-chip {

      padding:
        7px 10px;

      border-radius: 999px;

      background: var(--soft-green);

      color: var(--green-dark);

      font-size: 11px;

      font-weight: 700;

    }

    .partner-arrow {

      width: 38px;

      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #f3f5f4;

      color: #555;

      font-weight: 800;

    }


    /* ===============================
       LIST
    =============================== */

    .nearby-list,
    .partners-list,
    .favorites-list {

      display: grid;

      gap: 12px;

    }

    .nearby-card,
    .list-card {

      padding: 16px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: white;

      box-shadow: var(--shadow);

    }

    .list-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;

    }

    .list-right {

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .list-title {

      margin: 0;

      font-size: 18px;

      font-weight: 800;

    }

    .list-sub {

      margin-top: 4px;

      color: #777;

      font-size: 13px;

      line-height: 1.45;

    }

    .distance-pill {

      padding:
        7px 10px;

      border-radius: 999px;

      background: var(--soft-red);

      color: var(--red);

      font-size: 12px;

      font-weight: 800;

      white-space: nowrap;

    }

    .list-tags {

      margin-top: 12px;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }

    .tag {

      padding:
        7px 10px;

      border-radius: 999px;

      background: #f3f7f5;

      color: #567;

      font-size: 12px;

      font-weight: 700;

    }

    .action-row {

      margin-top: 14px;

      display: flex;

      gap: 10px;

    }

    .soft-btn {

      padding:
        11px 14px;

      border: none;

      border-radius: 14px;

      background: var(--soft-green);

      color: var(--green-dark);

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

    }

    .empty-note {

      padding: 24px;

      border:
        1px dashed #d8dfdb;

      border-radius: 18px;

      background: white;

      color: #777;

      font-size: 14px;

      line-height: 1.55;

      text-align: center;

    }

    .empty-heart {

      margin-bottom: 10px;

      font-size: 38px;

    }


    /* ===============================
       NOTIFICATION
    =============================== */

    .notification-panel {

      position: fixed;

      top: 84px;

      left: 16px;

      right: 16px;

      z-index: 150;

      max-width: 488px;

      margin: 0 auto;

      padding: 16px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: white;

      box-shadow:
        0 20px 50px rgba(0,0,0,.09);

    }

    .notification-item {

      padding: 12px 0;

      border-bottom:
        1px solid #f0f0f0;

    }

    .notification-title {

      font-size: 14px;

      font-weight: 800;

    }

    .notification-text {

      margin-top: 4px;

      color: #666;

      font-size: 13px;

    }

    .notification-time {

      margin-top: 6px;

      color: #999;

      font-size: 11px;

    }


    /* ===============================
       BOTTOM NAV
    =============================== */

    .bottom-nav {

      position: fixed;

      left: 50%;

      bottom: 0;

      z-index: 100;

      transform:
        translateX(-50%);

      width: 100%;

      max-width: 520px;

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      padding:
        9px 5px
        calc(9px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background:
        rgba(255,255,255,.97);

      backdrop-filter:
        blur(10px);

    }

    .nav-item {

      padding:
        8px 3px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;

      border: none;

      border-radius: 14px;

      background: transparent;

      color: #7b7b7b;

      font-size: 11px;

      font-weight: 700;

      cursor: pointer;

    }

    .nav-item.active {

      background: var(--soft-green);

      color: var(--green-dark);

    }

    .nav-icon {

      font-size: 20px;

    }

    .hidden {

      display:
        none !important;

    }


    @media(max-width:420px) {

      .top-wrap,
      .main-content {

        padding-left: 14px;

        padding-right: 14px;

      }

      .avatar {

        width: 46px;

        height: 46px;

      }

      .greeting-title {

        font-size: 20px;

      }

      .greeting-subtitle {

        font-size: 11px;

      }

      .change-filter-button {

        height: 40px;

        padding:
          0 7px;

        font-size: 9px;

      }

      .notif-button {

        width: 40px;

        height: 40px;

      }

      .categories-grid {

        gap: 8px;

      }

      .category-card {

        padding:
          11px 4px 10px;

      }

      .category-icon {

        width: 43px;

        height: 43px;

        font-size: 20px;

      }

      .category-name {

        font-size: 10px;

      }

      .nav-item {

        font-size: 10px;

      }

    }

  </style>

</head>


<body>


<div class="app">

  </div>


</div>

  </button>


</nav>

  JSON.parse(
    localStorage.getItem(
      "anc-favorite-partners"
    )
    ||
    "[]"
  );


function isFavorite(id) {

  return favoriteIds.includes(id);

}


function toggleFavorite(id) {

  if (
    favoriteIds.includes(id)
  ) {

    favoriteIds =
      favoriteIds.filter(
        favoriteId =>
          favoriteId !== id
      );

  }

  else {

    favoriteIds.push(id);

  }


  localStorage.setItem(
    "anc-favorite-partners",
    JSON.stringify(favoriteIds)
  );


  renderNewPartners(partners);

  renderPartnersList(partners);

  renderFavorites();

}


function favoriteIcon(id) {

  return isFavorite(id)
    ? "♥"
    : "♡";

}


function favoriteClass(id) {

  return isFavorite(id)
    ? "favorite-button active"
    : "favorite-button";

}

const locationInfoBox =

function toRad(value) {

  return value * Math.PI / 180;

}


function calcDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const dLat =
    toRad(
      lat2 - lat1
    );


  const dLon =
    toRad(
      lon2 - lon1
    );


  const a =

    Math.sin(dLat / 2)
    *
    Math.sin(dLat / 2)

    +

    Math.cos(
      toRad(lat1)
    )
    *
    Math.cos(
      toRad(lat2)
    )
    *
    Math.sin(dLon / 2)
    *
    Math.sin(dLon / 2);


  const c =

    2
    *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}



function renderNearby(
  userLat,
  userLng
) {

  const enriched =

    partners
      .map(
        partner => ({

          ...partner,

          distance:
            calcDistance(
              userLat,
              userLng,
              partner.lat,
              partner.lng
            )

        })
      )
      .sort(
        (a,b) =>
          a.distance -
          b.distance
      );


  nearbyList.innerHTML =
    "";


  enriched.forEach(
    function(item) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "nearby-card";


      card.innerHTML = `

        <div class="list-top">


          <div>

            <h3 class="list-title">

              ${item.name}

            </h3>


            <div class="list-sub">

              ${item.description}

            </div>

          </div>


          <div class="list-right">

            <div class="distance-pill">

              ${item.distance.toFixed(1)} km

            </div>


            <button
              class="${favoriteClass(item.id)}"
              onclick="
                toggleFavorite(${item.id});
                requestLocationAndRender();
              "
            >

              ${favoriteIcon(item.id)}

            </button>

          </div>

        </div>


        <div class="list-tags">

          <span class="tag">

            ${item.category}

          </span>


          <span class="tag">

            ${item.address}

          </span>

        </div>

      `;


      nearbyList.appendChild(
        card
      );

    }
  );

}



function requestLocationAndRender() {

  if (
    !navigator.geolocation
  ) {

    locationInfoBox.innerHTML =
      "Bu cihaz konum funksiyasını dəstəkləmir.";

    return;

  }


  locationInfoBox.innerHTML =
    "📍 Konum icazəsi gözlənilir...";


  navigator.geolocation
    .getCurrentPosition(

      function(position) {

        locationInfoBox.innerHTML =
          "✅ Yaxın partnyorlar məsafəyə görə sıralandı.";


        renderNearby(

          position.coords.latitude,

          position.coords.longitude

        );

      },


      function(error) {

        if (
          error.code === 1
        ) {

          locationInfoBox.innerHTML =
            "📍 Konum icazəsi verilmədi.";

        }

        else {

          locationInfoBox.innerHTML =
            "Konum məlumatını əldə etmək mümkün olmadı.";

        }

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 300000
      }

    );

}



/* ===============================
   NAVIGATION
=============================== */

const screens = {

  home:
    document.getElementById(
      "screen-home"
    ),

  nearby:
    document.getElementById(
      "screen-nearby"
    ),

  favorites:
    document.getElementById(
      "screen-favorites"
    ),

  partners:
    document.getElementById(
      "screen-partners"
    )

};


function openScreen(name) {

  Object
    .values(screens)
    .forEach(
      screen =>
        screen.classList.add(
          "hidden"
        )
    );


  screens[name]
    .classList
    .remove(
      "hidden"
    );


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      function(button) {

        button.classList.toggle(

          "active",

          button.dataset.screen ===
          name

        );

      }
    );


  if (
    name ===
    "nearby"
  ) {

    requestLocationAndRender();

  }


  if (
    name ===
    "favorites"
  ) {

    renderFavorites();

  }


  if (
    name ===
    "partners"
  ) {

    renderPartnersList(
      partners
    );

  }


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}



function openPartnersScreen(
  categoryName = null
) {

  openScreen(
    "partners"
  );


  if (!categoryName) {

    renderPartnersList(
      partners
    );

    return;

  }


  const filtered =

    partners.filter(
      item =>
        item.category.toLowerCase()
        ===
        categoryName.toLowerCase()
    );


  renderPartnersList(
    filtered
  );

}



document
  .querySelectorAll(
    ".nav-item"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",

          openScreen(

      );

    }
  );

  );
