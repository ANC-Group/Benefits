function partnerLogoHTML(
  partner,
  small = false
) {

  if (partner.logo) {

    const imageClass =
      small
        ? "small-partner-logo"
        : "partner-logo";


    const fallbackClass =
      small
        ? "small-logo-fallback"
        : "partner-logo-placeholder";


    return `

      <img
        src="${partner.logo}"
        alt="${partner.name}"
        class="${imageClass}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="${fallbackClass}"
        style="display:none;"
      >
        ${partner.name}
      </div>

    `;

  }


  return `

    <div
      class="${
        small
          ? "small-logo-fallback"
          : "partner-logo-placeholder"
      }"
    >
      ${partner.name}
    </div>

  `;

}
