
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANC Group İmtiyazlar Platforması</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green: #317f4c;
  --green-soft: #eaf6ee;
  --red: #d96763;
  --red-soft: #fdeeed;
  --bg: #f7f8f7;
  --text: #242424;
  --muted: #777;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.app {
  max-width: 540px;
  min-height: 100vh;
  margin: auto;
  padding-bottom: 90px;
}

header {
  padding: 24px 18px;
  background: linear-gradient(#fff1ef, var(--bg));
}

h1 {
  margin: 0;
  font-size: 25px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 7px;
}

.search {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #eee;
  border-radius: 16px;
  background: white;
  font-size: 14px;
  outline: none;
}

main {
  padding: 0 18px;
}

h2 {
  font-size: 21px;
  margin: 23px 0 14px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.category {
  padding: 15px 5px;
  background: white;
  border: 1px solid #eee;
  border-radius: 18px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
}

.category.active {
  background: var(--green-soft);
  color: var(--green);
  border-color: #cce5d3;
}

.category-icon {
  display: block;
  font-size: 24px;
  margin-bottom: 9px;
}

.cards {
  display: grid;
  gap: 14px;
}

.card {
  background: white;
  border-radius: 22px;
  border: 1px solid #eee;
  overflow: hidden;
  box-shadow: 0 8px 25px #00000008;
}

.card-cover {
  height: 155px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #eef8f1, #fff5f4);
}

.partner-logo {
  max-width: 75%;
  max-height: 105px;
  object-fit: contain;
}

.partner-placeholder {
  color: var(--green);
  font-size: 26px;
  font-weight: 900;
  text-align: center;
}

.discount {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--red);
  color: white;
  padding: 8px 10px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: bold;
}

.favorite {
  position: absolute;
  top: 13px;
  left: 13px;
  width: 38px;
  height: 38px;
  background: white;
  border: 1px solid #f0dddd;
  border-radius: 50%;
  color: var(--red);
  font-size: 22px;
  cursor: pointer;
}

.card-body {
  padding: 18px;
}

.partner-name {
  font-size: 19px;
  font-weight: 850;
}

.partner-description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 8px;
  white-space: pre-line;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 19px;
}

.category-chip {
  background: var(--green-soft);
  color: var(--green);
  padding: 8px 12px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: bold;
}

.detail-button {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  background: #f3f4f3;
  cursor: pointer;
  font-size: 19px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 540px;
  background: white;
  border-top: 1px solid #eee;
  display: flex;
  justify-content: space-around;
  padding: 13px 5px;
}

.nav-button {
  border: none;
  background: transparent;
  color: #777;
  font-weight: bold;
  cursor: pointer;
}

.nav-button.active {
  color: var(--green);
}

dialog {
  width: min(94vw, 520px);
  max-height: 85vh;
  overflow-y: auto;
  border: none;
  border-radius: 23px;
  padding: 22px;
  box-shadow: 0 20px 70px #0003;
}

dialog::backdrop {
  background: #0007;
}

.modal-logo {
  display: block;
  width: 200px;
  max-height: 120px;
  object-fit: contain;
  margin: 15px auto;
}

.modal-section {
  margin-top: 20px;
}

.modal-label {
  color: var(--green);
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 8px;
}

.modal-text {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-line;
}

.promo {
  padding: 15px;
  border-radius: 13px;
  background: var(--green-soft);
  color: var(--green);
  font-weight: bold;
}

.action-link, .copy-button {
  display: inline-block;
  margin: 5px 5px 5px 0;
  padding: 11px 13px;
  border: none;
  border-radius: 11px;
  background: var(--green-soft);
  color: var(--green);
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.close {
  float: right;
  border: none;
  background: #f1f1f1;
  border-radius: 50%;
  width: 35px;
  height: 35px;
  font-size: 19px;
  cursor: pointer;
}

.empty {
  padding: 30px;
  text-align: center;
  color: var(--muted);
  background: white;
  border-radius: 18px;
}

@media (min-width: 500px) {
  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Salam! 👋</h1>
  <div class="subtitle">
    ANC Group əməkdaşları üçün özəl imtiyazlar
  </div>

  <input
    class="search"
    id="searchInput"
    placeholder="🔎 Partnyor və ya kateqoriya axtar..."
  >
</header>

<main>
  <h2>Kateqoriyalar</h2>
  <div class="categories" id="categories"></div>

  <h2 id="sectionTitle">Yeni partnyorlar</h2>
  <div class="cards" id="partnerCards"></div>
</main>

<nav class="bottom-nav">
  <button class="nav-button active" data-tab="all">
    🏠 Ana səhifə
  </button>
  <button class="nav-button" data-tab="favorites">
    ❤️ Favoritlər
  </button>
  <button class="nav-button" data-tab="new">
    ✨ Yenilər
  </button>
</nav>

</div>

<dialog id="partnerDialog">
  <button class="close" id="closeDialog">×</button>
  <div id="dialogContent"></div>
</dialog>

<script src="partners.js"></script>

<script>
const partners = window.ANC_PARTNERS || [];

let currentCategory = "Hamısı";
let currentTab = "all";

let favorites = [];

try {
  favorites = JSON.parse(
    localStorage.getItem("ancFavorites") || "[]"
  );
} catch (e) {
  favorites = [];
}

if (!Array.isArray(favorites)) favorites = [];

const categories = [
  ["Hamısı", "🏠"],
  ["Restoran / Kafe", "☕"],
  ["Alış-veriş", "🛍️"],
  ["Sağlamlıq", "🩺"],
  ["Gözəllik", "💄"],
  ["İstirahət mərkəzi", "🏞️"],
  ["Təhsil", "🎓"],
  ["Səyahət", "✈️"],
  ["Uşaq", "🧸"],
  ["Əyləncə", "🎉"]
];

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );
}

function renderCategories() {
  document.getElementById("categories").innerHTML =
    categories.map(([name, icon]) => `
      <button
        class="category ${currentCategory === name ? "active" : ""}"
        data-category="${escapeHTML(name)}"
      >
        <span class="category-icon">${icon}</span>
        ${escapeHTML(name)}
      </button>
    `).join("");
}

function renderPartners() {
  const search = document.getElementById("searchInput")
    .value.toLocaleLowerCase("az").trim();

  let list = partners.filter(partner => {
    const matchesCategory =
      currentCategory === "Hamısı" ||
      partner.category === currentCategory;

    const searchable = [
      partner.name,
      partner.category,
      partner.details,
      partner.usage
    ].join(" ").toLocaleLowerCase("az");

    return matchesCategory && searchable.includes(search);
  });

  if (currentTab === "favorites") {
    list = list.filter(p => favorites.includes(p.id));
  }

  if (currentTab === "new") {
    list = list.filter(p => p.isNew);
  }

  document.getElementById("sectionTitle").textContent =
    currentTab === "favorites"
      ? "Favoritlər"
      : currentTab === "new"
      ? "Yeni partnyorlar"
      : "Partnyorlar";

  const container = document.getElementById("partnerCards");

  if (!list.length) {
    container.innerHTML =
      '<div class="empty">Partnyor tapılmadı.</div>';
    return;
  }

  container.innerHTML = list.map(p => `
    <div class="card">

      <div class="card-cover">

        <button
          class="favorite"
          data-favorite="${escapeHTML(p.id)}"
        >
          ${favorites.includes(p.id) ? "♥" : "♡"}
        </button>

        ${p.discount ? `
          <span class="discount">
            ${escapeHTML(p.discount)}
          </span>
        ` : ""}

        ${p.logo ? `
          <img
            class="partner-logo"
            src="${escapeHTML(p.logo)}"
            alt="${escapeHTML(p.name)} loqosu"
            loading="lazy"
          >
        ` : `
          <div class="partner-placeholder">
            ${escapeHTML(p.name)}
          </div>
        `}

      </div>

      <div class="card-body">
        <div class="partner-name">
          ${escapeHTML(p.name)}
        </div>

        <div class="partner-description">
          ${escapeHTML(p.details || p.category || "")}
        </div>

        <div class="card-bottom">
          <span class="category-chip">
            ${escapeHTML(p.category)}
          </span>

          <button
            class="detail-button"
            data-detail="${escapeHTML(p.id)}"
          >
            →
          </button>
        </div>
      </div>

    </div>
  `).join("");
}

function section(label, value) {
  if (!value) return "";

  return `
    <div class="modal-section">
      <div class="modal-label">${escapeHTML(label)}</div>
      <div class="modal-text">${escapeHTML(value)}</div>
    </div>
  `;
}

function safeLink(url, label) {
  if (!url) return "";

  try {
    const parsed = new URL(url);

    if (!["https:", "http:"].includes(parsed.protocol)) {
      return "";
    }

    return `
      <a
        class="action-link"
        href="${escapeHTML(parsed.href)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHTML(label)}
      </a>
    `;
  } catch (e) {
    return "";
  }
}

function openPartner(id) {
  const p = partners.find(item => item.id === id);
  if (!p) return;

  let html = "";

  if (p.logo) {
    html += `
      <img
        class="modal-logo"
        src="${escapeHTML(p.logo)}"
        alt="${escapeHTML(p.name)} loqosu"
      >
    `;
  }

  html += `
    <h2>${escapeHTML(p.name)}</h2>
  `;

  html += section("Kateqoriya", p.category);
  html += section("Endirim", p.discount);
  html += section("Ətraflı məlumat", p.details);
  html += section("İstifadə qaydası", p.usage);

  if (p.promoCode) {
    html += `
      <div class="modal-section">
        <div class="modal-label">Promokod</div>
        <div class="promo">
          ${escapeHTML(p.promoCode)}
        </div>
        <button class="copy-button" id="copyPromo">
          📋 Kopyala
        </button>
      </div>
    `;
  }

  html += section("Əlaqəli şəxs", p.relatedPerson);

  if (p.relatedPhone) {
    const phone = String(p.relatedPhone)
      .replace(/[^\d+]/g, "");

    html += `
      <div class="modal-section">
        <div class="modal-label">Əlaqə nömrəsi</div>
        <div class="modal-text">
          ${escapeHTML(p.relatedPhone)}
        </div>
        <a
          class="action-link"
          href="tel:${escapeHTML(phone)}"
        >
          📞 Zəng et
        </a>
      </div>
    `;
  }

  const mapLinks = (p.mapUrls || [])
    .map((url, index) =>
      safeLink(url, "📍 Ünvan " + (index + 1))
    ).join("");

  const socialLinks = [
    safeLink(p.facebook, "Facebook"),
    safeLink(p.instagram, "Instagram"),
    safeLink(p.whatsapp, "WhatsApp")
  ].join("");

  if (mapLinks || socialLinks) {
    html += `
      <div class="modal-section">
        <div class="modal-label">
          Ünvan və sosial şəbəkələr
        </div>
        ${mapLinks}
        ${socialLinks}
      </div>
    `;
  }

  document.getElementById("dialogContent").innerHTML = html;

  const copyButton = document.getElementById("copyPromo");

  if (copyButton) {
    copyButton.onclick = async () => {
      try {
        await navigator.clipboard.writeText(p.promoCode);
        copyButton.textContent = "✓ Kopyalandı";
      } catch (e) {
        copyButton.textContent = "Kopyalama alınmadı";
      }
    };
  }

  document.getElementById("partnerDialog").showModal();
}

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem(
    "ancFavorites",
    JSON.stringify(favorites)
  );

  renderPartners();
}

document.addEventListener("click", event => {
  const categoryButton = event.target.closest("[data-category]");

  if (categoryButton) {
    currentCategory = categoryButton.dataset.category;
    renderCategories();
    renderPartners();
  }

  const detailButton = event.target.closest("[data-detail]");

  if (detailButton) {
    openPartner(detailButton.dataset.detail);
  }

  const favoriteButton = event.target.closest("[data-favorite]");

  if (favoriteButton) {
    toggleFavorite(favoriteButton.dataset.favorite);
  }

  const navButton = event.target.closest("[data-tab]");

  if (navButton) {
    currentTab = navButton.dataset.tab;
    currentCategory = "Hamısı";

    document.getElementById("searchInput").value = "";

    document.querySelectorAll(".nav-button").forEach(button => {
      button.classList.toggle(
        "active",
        button === navButton
      );
    });

    renderCategories();
    renderPartners();
  }
});

document.getElementById("searchInput")
  .addEventListener("input", renderPartners);

document.getElementById("closeDialog")
  .addEventListener("click", () => {
    document.getElementById("partnerDialog").close();
  });

renderCategories();
renderPartners();
</script>

</body>
</html>
