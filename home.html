<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANC Group Benefits Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f8f7;
      --card: #ffffff;

      --soft-green: #e8f5ef;
      --green: #4ea97a;
      --green-dark: #2e7d5b;

      --soft-red: #fdeeed;
      --red: #d86b63;

      --soft-orange: #fff1e8;
      --orange: #ef8f57;

      --text: #232323;
      --muted: #8d8d8d;

      --border: #ececec;

      --shadow:
        0 10px 30px rgba(0,0,0,.05);

      --radius: 22px;
    }

    body {
      margin: 0;

      background: var(--bg);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      padding-bottom: 90px;
    }

    .app {
      max-width: 520px;

      margin: 0 auto;

      min-height: 100vh;

      background: var(--bg);
    }


    /* =========================================
       TOP
    ========================================= */

    .top-wrap {
      padding: 18px 18px 8px;

      background:
        linear-gradient(
          180deg,
          #fff1e8 0%,
          #f7f8f7 100%
        );
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .user-block {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ff9b61,
          #e96b42
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      flex-shrink: 0;

      box-shadow: var(--shadow);
    }

    .avatar svg {
      width: 34px;
      height: 34px;
    }

    .greeting-wrap {
      min-width: 0;
    }

    .greeting-title {
      margin: 0;

      font-size: 25px;
      font-weight: 800;

      line-height: 1.05;

      color: #2b2b2b;
    }

    .greeting-subtitle {
      margin-top: 5px;

      font-size: 13px;

      color: #747474;
    }


    /* =========================================
       TOP ACTIONS
    ========================================= */

    .top-actions {
      display: flex;
      align-items: center;

      gap: 7px;

      flex-shrink: 0;
    }

    .change-filter-button {
      height: 44px;

      padding: 0 11px;

      border:
        1px solid #d8e9df;

      border-radius: 14px;

      background: #eef8f3;

      color: var(--green-dark);

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;
    }

    .change-filter-button:hover {
      background: #e1f3e9;
    }

    .notif-button {
      position: relative;

      width: 46px;
      height: 46px;

      border-radius: 15px;

      border: none;

      background: var(--card);

      box-shadow: var(--shadow);

      cursor: pointer;

      flex-shrink: 0;
    }

    .notif-button svg {
      width: 22px;
      height: 22px;

      stroke: var(--green-dark);
    }

    .notif-badge {
      position: absolute;

      top: -4px;
      right: -4px;

      min-width: 22px;
      height: 22px;

      padding: 0 6px;

      border-radius: 999px;

      background: var(--red);

      color: white;

      font-size: 11px;
      font-weight: 800;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid var(--bg);
    }


    /* =========================================
       SEARCH
    ========================================= */

    .search-box {
      margin-top: 18px;

      background: var(--card);

      border-radius: 18px;

      padding: 14px 16px;

      display: flex;
      align-items: center;

      gap: 10px;

      box-shadow: var(--shadow);

      border:
        1px solid var(--border);
    }

    .search-box input {
      border: none;

      outline: none;

      width: 100%;

      font-size: 15px;

      background: transparent;

      color: var(--text);
    }

    .search-box input::placeholder {
      color: #9a9a9a;
    }


    /* =========================================
       MAIN
    ========================================= */

    .main-content {
      padding: 10px 18px 30px;
    }

    .section {
      margin-top: 22px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;

      gap: 12px;
    }

    .section-title {
      font-size: 23px;

      font-weight: 800;

      margin: 0;
    }

    .section-link {
      color: #8d8d8d;

      font-size: 13px;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;
    }


    /* =========================================
       CATEGORIES
    ========================================= */

    .categories-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .category-card {
      background: var(--card);

      border-radius: 20px;

      padding: 14px 8px 12px;

      text-align: center;

      border:
        1px solid var(--border);

      box-shadow: var(--shadow);

      cursor: pointer;

      transition:
        transform .15s ease;
    }

    .category-card:hover {
      transform:
        translateY(-2px);
    }

    .category-icon {
      width: 52px;
      height: 52px;

      margin:
        0 auto 10px;

      border-radius: 16px;

      background:
        var(--soft-orange);

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--orange);

      font-size: 24px;
    }

    .category-name {
      font-size: 12px;

      font-weight: 700;

      line-height: 1.25;

      color: #444;
    }


    /* =========================================
       PARTNER CARDS
    ========================================= */

    .cards-row {
      display: flex;

      gap: 14px;

      overflow-x: auto;

      padding-bottom: 6px;

      scroll-snap-type:
        x proximity;
    }

    .cards-row::-webkit-scrollbar {
      display: none;
    }

    .partner-card {
      min-width: 250px;

      background: var(--card);

      border-radius: 24px;

      border:
        1px solid var(--border);

      box-shadow: var(--shadow);

      overflow: hidden;

      scroll-snap-align: start;
    }

    .partner-banner {
      height: 150px;

      background:
        linear-gradient(
          135deg,
          var(--soft-green),
          #f6fbf8
        );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--green-dark);

      font-size: 38px;
      font-weight: 900;

      text-align: center;

      padding: 20px;
    }

    .discount-badge {
      position: absolute;

      top: 14px;
      right: 14px;

      background: var(--red);

      color: white;

      font-size: 12px;
      font-weight: 800;

      border-radius: 12px;

      padding: 6px 8px;
    }

    .partner-body {
      padding: 16px;
    }

    .partner-title {
      font-size: 19px;

      font-weight: 800;

      margin:
        0 0 8px;

      line-height: 1.2;
    }

    .partner-text {
      font-size: 13px;

      color: #666;

      line-height: 1.5;

      min-height: 42px;
    }

    .partner-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-top: 14px;
    }

    .partner-chip {
      background:
        var(--soft-green);

      color:
        var(--green-dark);

      font-size: 11px;
      font-weight: 700;

      padding:
        7px 10px;

      border-radius: 999px;

      display: inline-flex;
      align-items: center;

      gap: 6px;
    }

    .partner-arrow {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #f3f5f4;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #555;

      font-weight: 800;

      cursor: pointer;
    }


    /* =========================================
       LISTS
    ========================================= */

    .nearby-list,
    .partners-list {
      display: grid;

      gap: 12px;
    }

    .nearby-card,
    .list-card {
      background: var(--card);

      border:
        1px solid var(--border);

      border-radius: 20px;

      box-shadow: var(--shadow);

      padding: 16px;
    }

    .nearby-top,
    .list-top {
      display: flex;

      align-items: start;
      justify-content: space-between;

      gap: 12px;
    }

    .nearby-title,
    .list-title {
      margin: 0;

      font-size: 18px;

      font-weight: 800;
    }

    .nearby-sub,
    .list-sub {
      margin-top: 4px;

      font-size: 13px;

      color: #777;

      line-height: 1.45;
    }

    .distance-pill {
      background:
        var(--soft-red);

      color:
        var(--red);

      padding:
        7px 10px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;

      white-space: nowrap;
    }

    .list-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;
    }

    .tag {
      background: #f3f7f5;

      color: #567;

      border-radius: 999px;

      padding:
        7px 10px;

      font-size: 12px;
      font-weight: 700;
    }

    .action-row {
      display: flex;

      gap: 10px;

      margin-top: 14px;
    }

    .soft-btn {
      border: none;

      background:
        var(--soft-green);

      color:
        var(--green-dark);

      padding:
        11px 14px;

      border-radius: 14px;

      font-weight: 800;

      cursor: pointer;

      font-size: 13px;
    }

    .soft-btn.red {
      background:
        var(--soft-red);

      color:
        var(--red);
    }

    .empty-note {
      background: var(--card);

      border:
        1px dashed #d8dfdb;

      padding: 18px;

      border-radius: 18px;

      color: #777;

      font-size: 14px;

      line-height: 1.55;
    }


    /* =========================================
       NOTIFICATIONS
    ========================================= */

    .notification-panel {
      position: fixed;

      top: 84px;

      right: 16px;
      left: 16px;

      max-width: 488px;

      margin: 0 auto;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 20px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.09);

      z-index: 150;

      padding: 16px;
    }

    .notification-item {
      padding: 12px 0;

      border-bottom:
        1px solid #f0f0f0;
    }

    .notification-item:last-child {
      border-bottom: none;

      padding-bottom: 0;
    }

    .notification-title {
      font-size: 14px;

      font-weight: 800;

      margin-bottom: 4px;
    }

    .notification-text {
      font-size: 13px;

      color: #666;

      line-height: 1.45;
    }

    .notification-time {
      margin-top: 6px;

      font-size: 11px;

      color: #999;
    }


    /* =========================================
       BOTTOM NAV
    ========================================= */

    .bottom-nav {
      position: fixed;

      left: 50%;

      transform:
        translateX(-50%);

      bottom: 0;

      width: 100%;

      max-width: 520px;

      background:
        rgba(255,255,255,.97);

      border-top:
        1px solid var(--border);

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      padding:
        10px 8px
        calc(10px + env(safe-area-inset-bottom));

      z-index: 100;

      backdrop-filter:
        blur(10px);
    }

    .nav-item {
      border: none;

      background: transparent;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 6px;

      color: #7b7b7b;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      padding:
        8px 4px;

      border-radius: 14px;
    }

    .nav-item.active {
      color:
        var(--green-dark);

      background:
        var(--soft-green);
    }

    .nav-icon {
      font-size: 20px;

      line-height: 1;
    }


    /* =========================================
       UTILITIES
    ========================================= */

    .hidden {
      display:
        none !important;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media(max-width:420px) {

      .top-wrap {
        padding-left: 14px;
        padding-right: 14px;
      }

      .main-content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .greeting-title {
        font-size: 21px;
      }

      .greeting-subtitle {
        font-size: 11px;
      }

      .avatar {
        width: 48px;
        height: 48px;
      }

      .change-filter-button {
        height: 42px;

        padding:
          0 8px;

        font-size: 10px;
      }

      .notif-button {
        width: 42px;
        height: 42px;
      }

      .categories-grid {
        grid-template-columns:
          repeat(4,1fr);

        gap: 8px;
      }

      .category-card {
        padding:
          12px 5px 10px;
      }

      .category-icon {
        width: 44px;
        height: 44px;

        font-size: 20px;
      }

      .category-name {
        font-size: 10px;
      }

      .section-title {
        font-size: 21px;
      }

      .partner-card {
        min-width: 230px;
      }

    }

  </style>
</head>

</nav>

function askNotificationPermission() {


  if (

    return;

  }


  if (
    Notification.permission ===
    "default"
  ) {

    Notification.requestPermission();

const nearbyList =
  document.getElementById(
    "nearbyList"

const locationInfoBox =
  document.getElementById(
    "locationInfoBox"

function toRad(
  value
) {

  return (
    value *
    Math.PI /
    180
  );

}


function calcDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {


  const R =
    6371;


  const dLat =
    toRad(
      lat2 - lat1
    );


  const dLon =
    toRad(
      lon2 - lon1
    );


  const a =

    Math.sin(
      dLat / 2
    )
    *
    Math.sin(
      dLat / 2
    )

    +

    Math.cos(
      toRad(lat1)
    )
    *
    Math.cos(
      toRad(lat2)
    )
    *
    Math.sin(
      dLon / 2
    )
    *
    Math.sin(
      dLon / 2
    );


  const c =

    2 *
    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );


  return (
    R * c
  );

}



function renderNearby(
  userLat,
  userLng
) {


  const enriched =

    partners
      .map(
        function(partner) {

          return {

            ...partner,

            distance:
              calcDistance(
                userLat,
                userLng,
                partner.lat,
                partner.lng
              )

          };

        }
      )

      .sort(
        function(a,b) {

          return (
            a.distance -
            b.distance
          );

        }
      );


  nearbyList.innerHTML =
    "";


  enriched.forEach(
    function(item) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "nearby-card";


      card.innerHTML = `

        <div class="nearby-top">

          <div>

            <h3 class="nearby-title">

              ${item.name}

            </h3>

            <div class="nearby-sub">

              ${item.description}

            </div>


            <div class="list-tags">

              <span class="tag">

                ${item.category}

              </span>

              <span class="tag">

                ${item.address}

              </span>

            </div>

          </div>


          <div class="distance-pill">

            ${item.distance.toFixed(1)} km

          </div>

        </div>


        <div class="action-row">

          <button class="soft-btn">

            Ətraflı

          </button>

        </div>

      `;


      nearbyList.appendChild(
        card
      );


    }
  );

}



function requestLocationAndRender() {


  if (
    !navigator.geolocation
  ) {

    locationInfoBox.innerHTML =
      "Bu cihaz konum funksiyasını dəstəkləmir.";

    return;

  }


  locationInfoBox.innerHTML =
    "📍 Konum icazəsi gözlənilir...";


  navigator.geolocation.getCurrentPosition(

    function(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      locationInfoBox.innerHTML =
        "✅ Yaxınlıqdakı partnyorlar məsafəyə görə sıralandı.";


      renderNearby(
        latitude,
        longitude
      );


    },


    function(error) {


      let message =
        "Konum məlumatını əldə etmək mümkün olmadı.";


      if (
        error.code ===
        1
      ) {

        message =
          "📍 Konum icazəsi verilmədi. Yaxın partnyorları görmək üçün brauzerdən konum icazəsi verin.";

      }


      locationInfoBox.innerHTML =
        message;


    },


    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 300000
    }

  );

}



/* =========================================
   NAVIGATION
========================================= */

const screens = {

  home:
    document.getElementById(
      "screen-home"
    ),

  nearby:
    document.getElementById(
      "screen-nearby"
    ),

  partners:
    document.getElementById(
      "screen-partners"
    )

};


function openScreen(
  name
) {


  Object
    .values(
      screens
    )
    .forEach(
      function(screen) {

        screen.classList.add(
          "hidden"
        );

      }
    );


  screens[
    name
  ]
  .classList.remove(
    "hidden"
  );


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      function(button) {

        button.classList.toggle(

          "active",

          button.dataset.screen ===
          name

        );

      }
    );


  if (
    name ===
    "nearby"
  ) {

    requestLocationAndRender();

  }


  if (
    name ===
    "partners"
  ) {

    renderPartnersList(
      partners
    );

  }


  window.scrollTo({

    top: 0,

    behavior:
      "smooth"

  });

}



function openPartnersScreen(
  categoryName = null
) {


  openScreen(
    "partners"
  );


  if (
    !categoryName
  ) {

    renderPartnersList(
      partners
    );

    return;

  }


  const filtered =

    partners.filter(
      function(item) {

        return (

          item.category
            .toLowerCase()

          ===

          categoryName
            .toLowerCase()

        );

      }
    );


  renderPartnersList(
    filtered
  );

}



document
  .querySelectorAll(
    ".nav-item"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          openScreen(
            button.dataset.screen
          );

        }
      );

    }
  );

        renderCategories(
          categories

        renderNewPartners(
          partners

        return;

      }


      const filteredPartners =

        partners.filter(
          function(item) {


            const searchText = `

              ${item.name}
              ${item.category}
              ${item.description}
              ${item.address}

            `.toLowerCase();


            return searchText.includes(
              value
            );


          }
        );


      openPartnersScreen();


      renderPartnersList(
        filteredPartners
      );


    }
  );
