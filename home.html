<!DOCTYPE html>
<html lang="az">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Group İmtiyazlar Platforması</title>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #f7f8f7;
      --card: #ffffff;

      --green: #4db66b;
      --green-dark: #337f4b;
      --green-soft: #eaf7ee;

      --red: #d96662;
      --red-dark: #b94e4b;
      --red-soft: #fdeeed;

      --orange-soft: #fff1e8;

      --text: #262626;
      --muted: #858585;

      --border: #ececec;

      --shadow:
        0 10px 28px rgba(0,0,0,.055);

    }


    body {

      margin: 0;

      padding-bottom: 95px;

      background: var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    }


    button,
    input {
      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    a {
      text-decoration: none;
    }


    .app {

      width: 100%;

      max-width: 540px;

      min-height: 100vh;

      margin: auto;

      background: var(--bg);

    }


    /* ==============================
       HEADER
    ============================== */

    .top {

      padding: 18px 18px 10px;

      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(217,102,98,.10),
          transparent 36%
        ),
        linear-gradient(
          180deg,
          #fff4f2 0%,
          #f7f8f7 100%
        );

    }


    .top-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 11px;

      min-width: 0;

    }


    .avatar {

      width: 49px;

      height: 49px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #dd7772,
          #bf4d49
        );

      color: white;

      box-shadow: var(--shadow);

    }


    .avatar svg {

      width: 30px;

      height: 30px;

    }


    .hello-title {

      margin: 0;

      font-size: 21px;

      font-weight: 850;

      line-height: 1.1;

    }


    .hello-subtitle {

      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;

    }


    .top-actions {

      display: flex;

      align-items: center;

      gap: 6px;

      flex-shrink: 0;

    }


    .change-button {

      min-height: 40px;

      padding: 0 9px;

      border:
        1px solid #d7eadf;

      border-radius: 13px;

      background: var(--green-soft);

      color: var(--green-dark);

      font-size: 9px;

      font-weight: 800;

      white-space: nowrap;

    }


    .notification-button {

      position: relative;

      width: 42px;

      height: 42px;

      border: none;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);

      font-size: 19px;

    }


    .notification-badge {

      position: absolute;

      top: -5px;

      right: -5px;

      min-width: 21px;

      height: 21px;

      padding: 0 5px;

      display: none;

      align-items: center;

      justify-content: center;

      border:
        3px solid #fff4f2;

      border-radius: 999px;

      background: var(--red);

      color: white;

      font-size: 9px;

      font-weight: 850;

    }


    /* ==============================
       SEARCH
    ============================== */

    .search-box {

      height: 52px;

      margin-top: 18px;

      padding: 0 16px;

      display: flex;

      align-items: center;

      gap: 10px;

      border:
        1px solid var(--border);

      border-radius: 17px;

      background: white;

      box-shadow: var(--shadow);

    }


    .search-box input {

      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      font-size: 14px;

    }


    .search-icon {
      opacity: .6;
    }


    /* ==============================
       MAIN
    ============================== */

    main {

      padding: 5px 18px 30px;

    }


    .screen.hidden {
      display: none;
    }


    .section {
      margin-top: 23px;
    }


    .section-header {

      margin-bottom: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .section-title {

      margin: 0;

      font-size: 21px;

      font-weight: 850;

    }


    .section-link {

      border: none;

      background: transparent;

      color: var(--muted);

      font-size: 12px;

    }


    /* ==============================
       CATEGORIES
    ============================== */

    .categories {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 9px;

    }


    .category-card {

      min-height: 100px;

      padding: 11px 5px 9px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: white;

      box-shadow: var(--shadow);

    }


    .category-icon {

      width: 44px;

      height: 44px;

      margin-bottom: 8px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      background: var(--orange-soft);

      font-size: 20px;

    }


    .category-name {

      color: #464646;

      font-size: 10px;

      font-weight: 750;

      line-height: 1.2;

      text-align: center;

    }


    /* ==============================
       NEW PARTNERS
    ============================== */

    .horizontal-cards {

      display: flex;

      gap: 13px;

      overflow-x: auto;

      padding-bottom: 6px;

    }


    .horizontal-cards::-webkit-scrollbar {
      display: none;
    }


    .featured-card {

      min-width: 245px;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 22px;

      background: white;

      box-shadow: var(--shadow);

    }


    .featured-top {

      position: relative;

      height: 145px;

      padding: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #f4faf6,
          #ffffff
        );

    }


    .partner-logo {

      max-width: 82%;

      max-height: 105px;

      object-fit: contain;

      border-radius: 10px;

    }


    .partner-logo-placeholder {

      color: var(--green-dark);

      font-size: 26px;

      font-weight: 900;

      text-align: center;

    }


    .discount-badge {

      position: absolute;

      top: 13px;

      right: 13px;

      padding: 6px 9px;

      border-radius: 11px;

      background: var(--red);

      color: white;

      font-size: 11px;

      font-weight: 850;

    }


    .favorite-button {

      width: 36px;

      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid #f0dddd;

      border-radius: 50%;

      background: white;

      color: var(--red);

      font-size: 20px;

    }


    .favorite-button.active {

      background: var(--red-soft);

    }


    .featured-top .favorite-button {

      position: absolute;

      top: 12px;

      left: 12px;

      z-index: 3;

    }


    .featured-body {
      padding: 15px;
    }


    .featured-name {

      font-size: 17px;

      font-weight: 850;

    }


    .featured-description {

      margin-top: 6px;

      min-height: 35px;

      color: #727272;

      font-size: 12px;

      line-height: 1.45;

      white-space: pre-line;

    }


    .featured-bottom {

      margin-top: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

    }


    .category-chip {

      padding: 6px 9px;

      border-radius: 999px;

      background: var(--green-soft);

      color: var(--green-dark);

      font-size: 10px;

      font-weight: 800;

    }


    .open-button {

      width: 35px;

      height: 35px;

      border: none;

      border-radius: 50%;

      background: #f3f4f3;

      font-size: 17px;

    }


    /* ==============================
       PARTNER LIST
    ============================== */

    .partner-list {

      display: grid;

      gap: 12px;

    }


    .partner-card {

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background: white;

      box-shadow: var(--shadow);

    }


    .partner-card-main {

      display: flex;

      align-items: flex-start;

      gap: 12px;

    }


    .small-logo-box {

      width: 66px;

      height: 66px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      border:
        1px solid #efefef;

      border-radius: 15px;

      background: #fafafa;

    }


    .small-logo-box img {

      max-width: 92%;

      max-height: 92%;

      object-fit: contain;

    }


    .small-logo-fallback {

      color: var(--green-dark);

      font-size: 18px;

      font-weight: 900;

    }


    .partner-info {

      flex: 1;

      min-width: 0;

    }


    .partner-name {

      font-size: 17px;

      font-weight: 850;

    }


    .partner-description {

      margin-top: 5px;

      color: #757575;

      font-size: 12px;

      line-height: 1.5;

      white-space: pre-line;

    }


    .partner-actions-top {

      display: flex;

      align-items: center;

      gap: 7px;

    }


    .small-discount {

      padding: 6px 8px;

      border-radius: 999px;

      background: var(--red-soft);

      color: var(--red-dark);

      font-size: 11px;

      font-weight: 850;

      white-space: nowrap;

    }


    .tags {

      margin-top: 12px;

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

    }


    .tag {

      padding: 6px 9px;

      border-radius: 999px;

      background: #f3f7f5;

      color: #5c6861;

      font-size: 10px;

      font-weight: 750;

    }


    .card-buttons {

      margin-top: 13px;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    .soft-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 10px 13px;

      border: none;

      border-radius: 12px;

      background: var(--green-soft);

      color: var(--green-dark);

      font-size: 11px;

      font-weight: 800;

    }


    .soft-button.red {

      background: var(--red-soft);

      color: var(--red-dark);

    }


    /* ==============================
       EMPTY
    ============================== */

    .empty-box {

      padding: 27px 20px;

      border:
        1px dashed #d7dfda;

      border-radius: 18px;

      background: white;

      color: #777;

      font-size: 13px;

      line-height: 1.55;

      text-align: center;

    }


    .empty-icon {

      margin-bottom: 8px;

      font-size: 34px;

    }


    /* ==============================
       NOTIFICATION
    ============================== */

    .notification-panel {

      position: fixed;

      top: 78px;

      left: 16px;

      right: 16px;

      z-index: 400;

      max-width: 500px;

      margin: auto;

      padding: 16px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background: white;

      box-shadow:
        0 20px 55px rgba(0,0,0,.13);

    }


    .notification-panel.hidden {
      display: none;
    }


    .notification-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .close-button {

      width: 32px;

      height: 32px;

      border: none;

      border-radius: 50%;

      background: #f4f4f4;

      font-size: 16px;

    }


    .notification-item {

      padding: 11px 0;

      border-bottom:
        1px solid #f0f0f0;

    }


    .notification-item:last-child {
      border-bottom: none;
    }


    .notification-title {

      font-size: 13px;

      font-weight: 850;

    }


    .notification-text {

      margin-top: 4px;

      color: #6f6f6f;

      font-size: 12px;

    }


    /* ==============================
       MODAL
    ============================== */

    .modal-backdrop {

      position: fixed;

      inset: 0;

      z-index: 600;

      padding: 20px 14px;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      background:
        rgba(24,24,24,.43);

    }


    .modal-backdrop.hidden {
      display: none;
    }


    .modal {

      width: 100%;

      max-width: 520px;

      max-height: 88vh;

      overflow-y: auto;

      padding: 20px;

      border-radius:
        25px 25px 18px 18px;

      background: white;

      box-shadow:
        0 25px 70px rgba(0,0,0,.20);

    }


    .modal-header {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 12px;

    }


    .modal-logo {

      max-width: 190px;

      max-height: 90px;

      margin-bottom: 15px;

      object-fit: contain;

      border-radius: 8px;

    }


    .modal-title {

      margin: 0;

      font-size: 23px;

      font-weight: 900;

    }


    .modal-category {

      margin-top: 5px;

      color: var(--green-dark);

      font-size: 11px;

      font-weight: 800;

    }


    .modal-section {
      margin-top: 20px;
    }


    .modal-label {

      margin-bottom: 7px;

      color: #919191;

      font-size: 10px;

      font-weight: 850;

      text-transform: uppercase;

      letter-spacing: .6px;

    }


    .modal-content {

      color: #484848;

      font-size: 13px;

      line-height: 1.65;

      white-space: pre-line;

    }


    .discount-box {

      margin-top: 16px;

      padding: 14px 15px;

      border-radius: 15px;

      background: var(--red-soft);

      color: var(--red-dark);

    }


    .discount-box strong {
      font-size: 22px;
    }


    .promo-box {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 12px 14px;

      border:
        1px dashed #cde2d4;

      border-radius: 14px;

      background: var(--green-soft);

    }


    .promo-code {

      color: var(--green-dark);

      font-size: 18px;

      font-weight: 900;

    }


    .copy-button {

      padding: 8px 10px;

      border: none;

      border-radius: 10px;

      background: white;

      color: var(--green-dark);

      font-size: 10px;

      font-weight: 850;

    }


    .contact-box {

      padding: 15px;

      border:
        1px solid #d8e9df;

      border-radius: 15px;

      background: #f5fbf7;

    }


    .contact-name {

      font-size: 14px;

      font-weight: 850;

    }


    .phone-link {

      display: inline-flex;

      margin-top: 8px;

      color: var(--green-dark);

      font-size: 14px;

      font-weight: 850;

    }


    .contact-help {

      margin-top: 8px;

      color: #888;

      font-size: 10px;

    }


    .external-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    /* ==============================
       BOTTOM NAV
    ============================== */

    .bottom-nav {

      position: fixed;

      left: 50%;

      bottom: 0;

      z-index: 300;

      transform:
        translateX(-50%);

      width: 100%;

      max-width: 540px;

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      padding:
        8px 5px
        calc(8px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(12px);

    }


    .nav-button {

      padding: 7px 2px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 4px;

      border: none;

      border-radius: 13px;

      background: transparent;

      color: #7e7e7e;

      font-size: 9px;

      font-weight: 750;

    }


    .nav-button.active {

      background: var(--green-soft);

      color: var(--green-dark);

    }


    .nav-icon {
      font-size: 18px;
    }


    @media(max-width:420px) {

      .top,
      main {

        padding-left: 14px;

        padding-right: 14px;

      }


      .hello-title {
        font-size: 18px;
      }


      .change-button {

        padding: 0 6px;

        font-size: 8px;

      }


      .categories {
        gap: 7px;
      }


      .category-card {

        min-height: 94px;

        padding: 10px 3px 7px;

      }


      .category-icon {

        width: 40px;

        height: 40px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <header class="top">


    <div class="top-row">


      <div class="user-area">


        <div class="avatar">

          <svg
            viewBox="0 0 64 64"
            fill="none"
          >

            <circle
              cx="32"
              cy="18"
              r="10"
              fill="currentColor"
            />

            <path
              d="M14 52C16.5 42 23.5 36 32 36C40.5 36 47.5 42 50 52"
              fill="currentColor"
            />

          </svg>

        </div>


        <div>

          <h1
            class="hello-title"
            id="helloTitle"
          >
            Salam
          </h1>

          <div class="hello-subtitle">
            Özəl imtiyazları kəşf edin!
          </div>

        </div>


      </div>



      <div class="top-actions">


        <button
          class="change-button"
          id="changeButton"
        >
          Şirkət / kateqoriya
        </button>


        <button
          class="notification-button"
          id="notificationButton"
        >

          🔔

          <span
            class="notification-badge"
            id="notificationBadge"
          >
          </span>

        </button>


      </div>


    </div>



    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Partnyor və ya kateqoriya axtar"
      >

    </div>


  </header>



  <main>


    <!-- ƏSAS -->

    <section
      class="screen"
      id="screen-home"
    >


      <div class="section">


        <div class="section-header">

          <h2 class="section-title">
            Kateqoriyalar
          </h2>

          <button
            class="section-link"
            id="allCategoriesButton"
          >
            Hamısı ›
          </button>

        </div>


        <div
          class="categories"
          id="categoriesContainer"
        >
        </div>


      </div>



      <div class="section">


        <div class="section-header">

          <h2 class="section-title">
            Yeni partnyorlar
          </h2>

          <button
            class="section-link"
            id="allPartnersButton"
          >
            Hamısı ›
          </button>

        </div>


        <div
          class="horizontal-cards"
          id="newPartnersContainer"
        >
        </div>


      </div>


    </section>



    <!-- YAXINLIQDA -->

    <section
      class="screen hidden"
      id="screen-nearby"
    >

      <div class="section">

        <div class="section-header">

          <h2 class="section-title">
            Yaxınlıqda
          </h2>

        </div>


        <div
          class="empty-box"
          id="locationMessage"
        >

          Yaxın partnyorları görmək üçün konum icazəsi tələb olunur.

        </div>


        <div
          class="partner-list"
          id="nearbyContainer"
          style="margin-top:12px;"
        >
        </div>

      </div>

    </section>



    <!-- FAVORİLƏR -->

    <section
      class="screen hidden"
      id="screen-favorites"
    >

      <div class="section">

        <div class="section-header">

          <h2 class="section-title">
            Favorilər
          </h2>

          <span
            class="section-link"
            id="favoriteCount"
          >
            0 partnyor
          </span>

        </div>


        <div
          class="partner-list"
          id="favoritesContainer"
        >
        </div>

      </div>

    </section>



    <!-- PARTNYORLAR -->

    <section
      class="screen hidden"
      id="screen-partners"
    >

      <div class="section">

        <div class="section-header">

          <h2
            class="section-title"
            id="partnersTitle"
          >
            Partnyorlar
          </h2>

        </div>


        <div
          class="partner-list"
          id="partnersContainer"
        >
        </div>

      </div>

    </section>


  </main>


</div>



<!-- NOTIFICATION PANEL -->

<div
  class="notification-panel hidden"
  id="notificationPanel"
>


  <div class="notification-header">

    <strong>
      Bildirişlər
    </strong>

    <button
      class="close-button"
      id="closeNotificationButton"
    >
      ✕
    </button>

  </div>


  <div id="notificationContainer">
  </div>


</div>



<!-- MODAL -->

<div
  class="modal-backdrop hidden"
  id="modalBackdrop"
>


  <div class="modal">


    <div class="modal-header">


      <div>

        <div id="modalLogoBox">
        </div>

        <h2
          class="modal-title"
          id="modalTitle"
        >
        </h2>

        <div
          class="modal-category"
          id="modalCategory"
        >
        </div>

      </div>


      <button
        class="close-button"
        id="closeModalButton"
      >
        ✕
      </button>


    </div>


    <div id="modalBody">
    </div>


  </div>


</div>



<!-- BOTTOM NAV -->

<nav class="bottom-nav">


  <button
    class="nav-button active"
    data-screen="home"
  >

    <span class="nav-icon">🏠</span>

    <span>Əsas</span>

  </button>


  <button
    class="nav-button"
    data-screen="nearby"
  >

    <span class="nav-icon">📍</span>

    <span>Yaxınlıqda</span>

  </button>


  <button
    class="nav-button"
    data-screen="favorites"
  >

    <span class="nav-icon">♥</span>

    <span>Favorilər</span>

  </button>


  <button
    class="nav-button"
    data-screen="partners"
  >

    <span class="nav-icon">🤝</span>

    <span>Partnyorlar</span>

  </button>


</nav>



<script src="partners.js"></script>


<script>


/* ==============================
   USER
============================== */

const firstName =
  localStorage.getItem(
    "anc-first-name"
  )
  ||
  "Əməkdaş";


document
  .getElementById(
    "helloTitle"
  )
  .textContent =
    `Salam, ${firstName}`;



/* ==============================
   PARTNER DATA
============================== */

const partners =
  Array.isArray(
    window.ANC_PARTNERS
  )
  ?
  window.ANC_PARTNERS
  :
  [];



const categories = [

  {
    name: "Restoran / Kafe",
    icon: "☕"
  },

  {
    name: "Alış-veriş",
    icon: "🛍️"
  },

  {
    name: "Sağlamlıq",
    icon: "🩺"
  },

  {
    name: "Gözəllik",
    icon: "💄"
  },

  {
    name: "İstirahət mərkəzi",
    icon: "🏞️"
  },

  {
    name: "Təhsil",
    icon: "🎓"
  },

  {
    name: "Səyahət",
    icon: "✈️"
  },

  {
    name: "Uşaq",
    icon: "🧸"
  },

  {
    name: "Əyləncə",
    icon: "🎉"
  }

];



/* ==============================
   FAVORITES
============================== */

let favoriteIds =
  JSON.parse(
    localStorage.getItem(
      "anc-favorite-partners"
    )
    ||
    "[]"
  );


function isFavorite(id) {

  return favoriteIds.includes(
    id
  );

}


function saveFavorites() {

  localStorage.setItem(
    "anc-favorite-partners",
    JSON.stringify(
      favoriteIds
    )
  );

}


function toggleFavorite(id) {

  if (
    favoriteIds.includes(id)
  ) {

    favoriteIds =
      favoriteIds.filter(
        savedId =>
          savedId !== id
      );

  }

  else {

    favoriteIds.push(id);

  }


  saveFavorites();

  renderNewPartners();

  renderPartners(
    currentPartnerList
  );

  renderFavorites();

}



/* ==============================
   HELPERS
============================== */

function shortDescription(
  partner
) {

  if (partner.details) {
    return partner.details;
  }

  if (partner.discount) {
    return `${partner.discount} endirim`;
  }

  return "ANC Group əməkdaşları üçün xüsusi imtiyaz.";
}



function partnerLogoHTML(
  partner,
  small = false
) {

  if (partner.logo) {

    return `

      <img
        src="${partner.logo}"
        alt="${partner.name}"
        class="${small ? "" : "partner-logo"}"
      >

    `;

  }


  return `

    <div class="${small ? "small-logo-fallback" : "partner-logo-placeholder"}">

      ${partner.name}

    </div>

  `;

}



function favoriteButtonHTML(
  partner
) {

  const active =
    isFavorite(
      partner.id
    );


  return `

    <button
      class="favorite-button ${active ? "active" : ""}"
      onclick="
        event.stopPropagation();
        toggleFavorite('${partner.id}');
      "
    >

      ${active ? "♥" : "♡"}

    </button>

  `;

}



/* ==============================
   CATEGORIES
============================== */

const categoriesContainer =
  document.getElementById(
    "categoriesContainer"
  );


function renderCategories() {

  categoriesContainer.innerHTML =
    "";


  categories.forEach(
    function(category) {

      const card =
        document.createElement(
          "button"
        );


      card.className =
        "category-card";


      card.innerHTML = `

        <div class="category-icon">
          ${category.icon}
        </div>

        <div class="category-name">
          ${category.name}
        </div>

      `;


      card.addEventListener(
        "click",
        function() {

          openPartnersByCategory(
            category.name
          );

        }
      );


      categoriesContainer.appendChild(
        card
      );

    }
  );

}



/* ==============================
   NEW PARTNERS

   Excel-də əlavə olunma tarixi/statusu
   olmadığı üçün hazırkı siyahını burada
   göstəririk.
============================== */

const newPartnersContainer =
  document.getElementById(
    "newPartnersContainer"
  );


function renderNewPartners() {

  newPartnersContainer.innerHTML =
    "";


  partners.forEach(
    function(partner) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "featured-card";


      card.innerHTML = `

        <div class="featured-top">

          ${favoriteButtonHTML(partner)}

          ${partnerLogoHTML(partner)}

          ${
            partner.discount
            ?
            `
              <div class="discount-badge">
                ${partner.discount}
              </div>
            `
            :
            ""
          }

        </div>


        <div class="featured-body">

          <div class="featured-name">
            ${partner.name}
          </div>

          <div class="featured-description">
            ${shortDescription(partner)}
          </div>

          <div class="featured-bottom">

            <span class="category-chip">
              ${partner.category}
            </span>

            <button
              class="open-button"
              onclick="openPartner('${partner.id}')"
            >
              →
            </button>

          </div>

        </div>

      `;


      newPartnersContainer.appendChild(
        card
      );

    }
  );

}



/* ==============================
   PARTNERS
============================== */

const partnersContainer =
  document.getElementById(
    "partnersContainer"
  );


let currentPartnerList =
  partners;


function renderPartners(list) {

  currentPartnerList =
    list;


  partnersContainer.innerHTML =
    "";


  if (!list.length) {

    partnersContainer.innerHTML = `

      <div class="empty-box">

        Bu bölmədə hazırda partnyor yoxdur.

      </div>

    `;

    return;

  }


  list.forEach(
    function(partner) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "partner-card";


      card.innerHTML = `

        <div class="partner-card-main">


          <div class="small-logo-box">

            ${partnerLogoHTML(partner, true)}

          </div>


          <div class="partner-info">

            <div class="partner-name">

              ${partner.name}

            </div>


            <div class="partner-description">

              ${shortDescription(partner)}

            </div>

          </div>


          <div class="partner-actions-top">

            ${
              partner.discount
              ?
              `
                <span class="small-discount">
                  ${partner.discount}
                </span>
              `
              :
              ""
            }

            ${favoriteButtonHTML(partner)}

          </div>


        </div>


        <div class="tags">

          <span class="tag">

            ${partner.category}

          </span>

        </div>


        <div class="card-buttons">

          <button
            class="soft-button"
            onclick="openPartner('${partner.id}')"
          >
            Ətraflı
          </button>

          ${
            partner.locations &&
            partner.locations.length
            ?
            `
              <a
                class="soft-button red"
                href="${partner.locations[0]}"
                target="_blank"
                rel="noopener"
              >
                📍 Xəritədə aç
              </a>
            `
            :
            ""
          }

        </div>

      `;


      partnersContainer.appendChild(
        card
      );

    }
  );

}



/* ==============================
   FAVORITES
============================== */

const favoritesContainer =
  document.getElementById(
    "favoritesContainer"
  );


function renderFavorites() {

  const favorites =
    partners.filter(
      partner =>
        favoriteIds.includes(
          partner.id
        )
    );


  document
    .getElementById(
      "favoriteCount"
    )
    .textContent =
      `${favorites.length} partnyor`;


  favoritesContainer.innerHTML =
    "";


  if (!favorites.length) {

    favoritesContainer.innerHTML = `

      <div class="empty-box">

        <div class="empty-icon">
          ♡
        </div>

        Hələ heç bir partnyoru favorilərə
        əlavə etməmisiniz.

        <br><br>

        Tez-tez istifadə etdiyiniz partnyorun
        ürək işarəsinə toxunun.

      </div>

    `;

    return;

  }


  favorites.forEach(
    function(partner) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "partner-card";


      card.innerHTML = `

        <div class="partner-card-main">


          <div class="small-logo-box">

            ${partnerLogoHTML(partner, true)}

          </div>


          <div class="partner-info">

            <div class="partner-name">
              ${partner.name}
            </div>

            <div class="partner-description">
              ${shortDescription(partner)}
            </div>

          </div>


          <div class="partner-actions-top">

            ${
              partner.discount
              ?
              `
                <span class="small-discount">
                  ${partner.discount}
                </span>
              `
              :
              ""
            }

            <button
              class="favorite-button active"
              onclick="toggleFavorite('${partner.id}')"
            >
              ♥
            </button>

          </div>


        </div>


        <div class="card-buttons">

          <button
            class="soft-button"
            onclick="openPartner('${partner.id}')"
          >
            Ətraflı
          </button>

        </div>

      `;


      favoritesContainer.appendChild(
        card
      );

    }
  );

}



/* ==============================
   MODAL
============================== */

const modalBackdrop =
  document.getElementById(
    "modalBackdrop"
  );


function cleanPhone(number) {

  return number.replace(
    /[^\d+]/g,
    ""
  );

}



function openPartner(
  partnerId
) {

  const partner =
    partners.find(
      item =>
        item.id ===
        partnerId
    );


  if (!partner) {
    return;
  }


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      partner.name;


  document
    .getElementById(
      "modalCategory"
    )
    .textContent =
      partner.category;


  const logoBox =
    document.getElementById(
      "modalLogoBox"
    );


  if (partner.logo) {

    logoBox.innerHTML = `

      <img
        src="${partner.logo}"
        alt="${partner.name}"
        class="modal-logo"
      >

    `;

  }

  else {

    logoBox.innerHTML =
      "";

  }


  let html =
    "";


  if (partner.discount) {

    html += `

      <div class="discount-box">

        <div class="modal-label">
          Endirim
        </div>

        <strong>
          ${partner.discount}
        </strong>

      </div>

    `;

  }


  if (partner.details) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          Ətraflı məlumat
        </div>

        <div class="modal-content">
          ${partner.details}
        </div>

      </div>

    `;

  }


  if (partner.usage) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          İstifadə qaydası
        </div>

        <div class="modal-content">
          ${partner.usage}
        </div>

      </div>

    `;

  }


  if (partner.promoCode) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          Promokod
        </div>

        <div class="promo-box">

          <div class="promo-code">
            ${partner.promoCode}
          </div>

          <button
            class="copy-button"
            onclick="copyPromoCode('${partner.promoCode}')"
          >
            Kopyala
          </button>

        </div>

      </div>

    `;

  }


  if (
    partner.relatedPerson ||
    partner.relatedPhone
  ) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          Problem yarandıqda əlaqə
        </div>

        <div class="contact-box">

          ${
            partner.relatedPerson
            ?
            `
              <div class="contact-name">
                ${partner.relatedPerson}
              </div>
            `
            :
            ""
          }

          ${
            partner.relatedPhone
            ?
            `
              <a
                class="phone-link"
                href="tel:${cleanPhone(partner.relatedPhone)}"
              >
                📞 ${partner.relatedPhone}
              </a>
            `
            :
            ""
          }

          <div class="contact-help">

            İmtiyazdan istifadə zamanı problem
            yaranarsa əlaqə saxlaya bilərsiniz.

          </div>

        </div>

      </div>

    `;

  }


  if (
    partner.locations &&
    partner.locations.length
  ) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          Məkanlar
        </div>

        <div class="external-buttons">

          ${partner.locations
            .map(
              (url, index) => `

                <a
                  class="soft-button"
                  href="${url}"
                  target="_blank"
                  rel="noopener"
                >
                  📍 Məkan ${index + 1}
                </a>

              `
            )
            .join("")}

        </div>

      </div>

    `;

  }


  if (
    partner.instagram ||
    partner.facebook ||
    partner.whatsapp
  ) {

    html += `

      <div class="modal-section">

        <div class="modal-label">
          Əlaqə və sosial media
        </div>

        <div class="external-buttons">

          ${
            partner.instagram
            ?
            `
              <a
                class="soft-button"
                href="${partner.instagram}"
                target="_blank"
                rel="noopener"
              >
                Instagram
              </a>
            `
            :
            ""
          }

          ${
            partner.facebook
            ?
            `
              <a
                class="soft-button"
                href="${partner.facebook}"
                target="_blank"
                rel="noopener"
              >
                Facebook
              </a>
            `
            :
            ""
          }

          ${
            partner.whatsapp
            ?
            `
              <a
                class="soft-button"
                href="${partner.whatsapp}"
                target="_blank"
                rel="noopener"
              >
                WhatsApp
              </a>
            `
            :
            ""
          }

        </div>

      </div>

    `;

  }


  document
    .getElementById(
      "modalBody"
    )
    .innerHTML =
      html;


  modalBackdrop
    .classList
    .remove(
      "hidden"
    );

}



function closeModal() {

  modalBackdrop
    .classList
    .add(
      "hidden"
    );

}


document
  .getElementById(
    "closeModalButton"
  )
  .addEventListener(
    "click",
    closeModal
  );


modalBackdrop.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      modalBackdrop
    ) {

      closeModal();

    }

  }
);



function copyPromoCode(code) {

  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(code);

  }


  alert(
    "Promokod kopyalandı: " +
    code
  );

}



/* ==============================
   NOTIFICATIONS
============================== */

const currentPartnerIds =
  partners.map(
    partner =>
      partner.id
  );


let seenPartnerIds =
  JSON.parse(
    localStorage.getItem(
      "anc-seen-partners"
    )
    ||
    "[]"
  );


function unseenPartners() {

  return partners.filter(
    partner =>
      !seenPartnerIds.includes(
        partner.id
      )
  );

}



function renderNotifications() {

  const unseen =
    unseenPartners();


  const badge =
    document.getElementById(
      "notificationBadge"
    );


  if (unseen.length) {

    badge.style.display =
      "flex";

    badge.textContent =
      unseen.length;

  }

  else {

    badge.style.display =
      "none";

  }


  const list =
    unseen.length
    ?
    unseen
    :
    partners;


  document
    .getElementById(
      "notificationContainer"
    )
    .innerHTML =

      list
        .map(
          partner => `

            <div class="notification-item">

              <div class="notification-title">

                ${
                  unseen.length
                  ?
                  "Yeni partnyor əlavə edildi 🎉"
                  :
                  partner.name
                }

              </div>

              <div class="notification-text">

                ${
                  unseen.length
                  ?
                  `${partner.name}${partner.discount ? ` — ${partner.discount}` : ""}`
                  :
                  "Partnyor imtiyazı aktivdir."
                }

              </div>

            </div>

          `
        )
        .join("");

}



document
  .getElementById(
    "notificationButton"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "notificationPanel"
        )
        .classList
        .toggle(
          "hidden"
        );


      seenPartnerIds =
        currentPartnerIds;


      localStorage.setItem(
        "anc-seen-partners",
        JSON.stringify(
          seenPartnerIds
        )
      );


      setTimeout(
        renderNotifications,
        200
      );

    }
  );


document
  .getElementById(
    "closeNotificationButton"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "notificationPanel"
        )
        .classList
        .add(
          "hidden"
        );

    }
  );



/* ==============================
   NEARBY
============================== */

const nearbyContainer =
  document.getElementById(
    "nearbyContainer"
  );


const locationMessage =
  document.getElementById(
    "locationMessage"
  );


function renderLocationPartners() {

  const mapPartners =
    partners.filter(
      partner =>
        partner.locations &&
        partner.locations.length
    );


  nearbyContainer.innerHTML =
    "";


  if (!mapPartners.length) {

    nearbyContainer.innerHTML = `

      <div class="empty-box">

        Hələ xəritə məlumatı əlavə edilmiş
        partnyor yoxdur.

      </div>

    `;

    return;

  }


  mapPartners.forEach(
    function(partner) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "partner-card";


      card.innerHTML = `

        <div class="partner-card-main">


          <div class="small-logo-box">

            ${partnerLogoHTML(partner, true)}

          </div>


          <div class="partner-info">

            <div class="partner-name">
              ${partner.name}
            </div>

            <div class="partner-description">
              ${partner.locations.length} məkan
            </div>

          </div>

        </div>


        <div class="card-buttons">

          ${partner.locations
            .map(
              (url, index) => `

                <a
                  class="soft-button"
                  href="${url}"
                  target="_blank"
                  rel="noopener"
                >
                  📍 Məkan ${index + 1}
                </a>

              `
            )
            .join("")}

        </div>

      `;


      nearbyContainer.appendChild(
        card
      );

    }
  );

}



function requestLocation() {

  if (
    !navigator.geolocation
  ) {

    locationMessage.textContent =
      "Bu cihaz konum funksiyasını dəstəkləmir.";

    renderLocationPartners();

    return;

  }


  locationMessage.textContent =
    "📍 Konum icazəsi gözlənilir...";


  navigator.geolocation
    .getCurrentPosition(

      function() {

        locationMessage.innerHTML =

          `✅ Konum icazəsi aktivdir.<br><br>
          Hazırkı Excel-də Google Maps linkləri var.
          Partnyor koordinatları əlavə olunanda
          onları real məsafəyə görə sıralayacağıq.`;

        renderLocationPartners();

      },


      function(error) {

        if (
          error.code === 1
        ) {

          locationMessage.textContent =
            "📍 Konum icazəsi verilmədi.";

        }

        else {

          locationMessage.textContent =
            "Konum məlumatını əldə etmək mümkün olmadı.";

        }


        renderLocationPartners();

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 300000
      }

    );

}



/* ==============================
   NAVIGATION
============================== */

const screens = {

  home:
    document.getElementById(
      "screen-home"
    ),

  nearby:
    document.getElementById(
      "screen-nearby"
    ),

  favorites:
    document.getElementById(
      "screen-favorites"
    ),

  partners:
    document.getElementById(
      "screen-partners"
    )

};



function openScreen(
  name
) {

  Object
    .values(
      screens
    )
    .forEach(
      screen =>

        screen
          .classList
          .add(
            "hidden"
          )

    );


  screens[name]
    .classList
    .remove(
      "hidden"
    );


  document
    .querySelectorAll(
      ".nav-button"
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          "active",
          button.dataset.screen ===
          name
        );

      }
    );


  if (
    name ===
    "partners"
  ) {

    document
      .getElementById(
        "partnersTitle"
      )
      .textContent =
        "Partnyorlar";

    renderPartners(
      partners
    );

  }


  if (
    name ===
    "favorites"
  ) {

    renderFavorites();

  }


  if (
    name ===
    "nearby"
  ) {

    requestLocation();

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



function openPartnersByCategory(
  category
) {

  openScreen(
    "partners"
  );


  document
    .getElementById(
      "partnersTitle"
    )
    .textContent =
      category;


  renderPartners(

    partners.filter(
      partner =>
        partner.category ===
        category
    )

  );

}



document
  .querySelectorAll(
    ".nav-button"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          openScreen(
            button.dataset.screen
          );

        }
      );

    }
  );


document
  .getElementById(
    "allPartnersButton"
  )
  .addEventListener(
    "click",
    function() {

      openScreen(
        "partners"
      );

    }
  );


document
  .getElementById(
    "allCategoriesButton"
  )
  .addEventListener(
    "click",
    function() {

      openScreen(
        "partners"
      );

    }
  );



/* ==============================
   SEARCH
============================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {

      const search =
        this.value
          .trim()
          .toLowerCase();


      if (!search) {

        openScreen(
          "home"
        );

        return;

      }


      const results =
        partners.filter(
          function(partner) {

            const text = `

              ${partner.name || ""}
              ${partner.category || ""}
              ${partner.discount || ""}
              ${partner.details || ""}
              ${partner.usage || ""}

            `.toLowerCase();


            return text.includes(
              search
            );

          }
        );


      openScreen(
        "partners"
      );


      document
        .getElementById(
          "partnersTitle"
        )
        .textContent =
          "Axtarış nəticələri";


      renderPartners(
        results
      );

    }
  );
